        sel.style.cssText = "flex:1;background:#0a0f1a;border:1px solid rgba(0,238,255,0.3);color:#00eeff;font-family:'Lato',sans-serif;font-size:12px;padding:6px 8px;border-radius:3px;";
        sel.innerHTML = `<option value="">Add series to quest...</option>` + addableNames.map(n => `<option value="${n}">${n}</option>`).join('');
        const addBtn = document.createElement('button');
        addBtn.style.cssText = "background:rgba(0,60,80,0.8);border:1px solid rgba(0,238,255,0.4);color:#00eeff;font-family:'Cinzel',serif;font-size:11px;padding:6px 12px;cursor:pointer;border-radius:3px;";
        addBtn.textContent = '+ ADD';
        addBtn.addEventListener('click', () => {
          if (!sel.value) return;
          addSeriesToQuest(sel.value);
          renderSeriesTab();
        });
        addRow.appendChild(sel);
        addRow.appendChild(addBtn);
        questSection.appendChild(addRow);
      }

      body.appendChild(questSection);
    }

    if(!all.length){
      const empty=document.createElement('div');
      empty.style.cssText=`color:#555;font-size:14px;font-family:'Lato',sans-serif;padding:6px 0;`;
      empty.textContent='No series yet. Create one below.';
      body.appendChild(empty);
    } else {
      all.forEach(s=>{
        const isFeatured = s.name === featuredName;
        const isChallenge = !!s._isChallengeSeries;
        const row=document.createElement('div');
        const rowBg = isFeatured ? '#1a1206' : isChallenge ? '#1a0505' : '#1a1a2e';
        const rowBorder = isFeatured ? 'rgba(200,160,60,0.4)' : isChallenge ? 'rgba(220,60,60,0.45)' : '#333';
        row.style.cssText=`display:flex;flex-direction:column;background:${rowBg};border:1px solid ${rowBorder};padding:10px 10px;border-radius:3px;gap:8px;`;

        const locked = isFeatured && !adminMode;

        const hdr2=document.createElement('div');
        hdr2.style.cssText='display:flex;align-items:center;gap:7px;flex-wrap:wrap;';
        hdr2.innerHTML=`
          <div style="flex:1;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
            <div class="usName" style="color:${isFeatured?'#f5c842':isChallenge?'#e63946':'#ffd700'};font-size:14px;font-family:'Lato',sans-serif;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${locked?'':'cursor:pointer;'}" ${locked?'':' title="Tap to rename"'}>${s.name}</div>
            ${isFeatured?`<span style="background:rgba(245,200,66,0.15);border:1px solid rgba(245,200,66,0.4);color:#f5c842;font-family:'Cinzel',serif;font-size:9px;padding:1px 6px;border-radius:2px;white-space:nowrap;flex-shrink:0;">⭐ FEATURED</span>`:''}
            <div class="seriesCount" style="color:#666;font-size:12px;font-family:'Lato',sans-serif;">${s.levels.length} map${s.levels.length!==1?'s':''}</div>
          </div>
          ${isFeatured && adminMode ? `<button class="usPush" style="${btnTeal}font-size:11px;padding:5px 10px;" title="Push to cloud quest">☁ Push</button>` : ''}
          ${!isFeatured ? `<button class="usPublish" style="background:none;border:1px solid ${s.is_public?'rgba(245,200,66,0.6)':'rgba(140,140,140,0.3)'};color:${s.is_public?'#f5c842':'rgba(160,160,160,0.5)'};font-family:'Lato',sans-serif;font-size:11px;padding:5px 10px;cursor:pointer;border-radius:3px;" title="${s.is_public?'Published - tap to unpublish':'Publish this series'}">${s.is_public?'🌐 Public':'○ Private'}</button>` : ''}
          <button class="usShare" style="font-family:'Lato',sans-serif;font-weight:700;font-size:11px;cursor:pointer;border-radius:3px;flex-shrink:0;padding:6px 10px;background:rgba(40,28,5,0.95);border:1px solid rgba(245,200,66,0.55);color:#f5c842;letter-spacing:0.5px;">SHARE</button>
          ${locked ? '' : `<button class="usDel" style="${btnDanger}">×</button>`}`;
        row.appendChild(hdr2);

        // Draggable level list
        const lvList=document.createElement('div');
        lvList.style.cssText='display:flex;flex-direction:column;gap:4px;';
        let dragSrcIdx=null;

        function rebuildLvList(){
          lvList.innerHTML='';
          const fresh=savedSeries().find(x=>x.name===s.name);
          if(!fresh) return;
          s=fresh;
          if(isFeatured){ const hc=HARDCODED_SERIES.find(x=>x.name===s.name); if(hc) hc.levels=s.levels; }
          fresh.levels.forEach((l,i)=>{
            const lrow=document.createElement('div');
            lrow.dataset.idx=i;
            lrow.style.cssText=`display:flex;align-items:center;background:#0f0f1a;border:1px solid #333;padding:7px 10px;border-radius:2px;gap:7px;${locked?'':'cursor:grab;user-select:none;'}`;
            if(!locked) lrow.draggable=true;
            lrow.innerHTML=`
              ${locked ? `<span style="color:#333;font-size:14px;">☰</span>` : `<span style="color:#555;font-size:14px;">☰</span>`}
              <span class="lvName" style="color:${locked?'#555':'#aaa'};font-size:13px;font-family:'Lato',sans-serif;flex:1;${locked?'':'cursor:pointer;'}" ${locked?'':'title="Tap to rename"'}>${i+1}. ${l.name||'Level'}</span>
              ${locked ? '' : `<button class="smLoadLv" data-idx="${i}" style="${btnGhost}padding:4px 10px;font-size:12px;">LOAD</button>
              <button class="smRemoveLv" data-idx="${i}" title="Remove from series" style="background:none;border:1px solid rgba(180,80,80,0.4);color:#e66;font-size:18px;line-height:1;padding:2px 8px;border-radius:3px;cursor:pointer;flex-shrink:0;">−</button>`}`;
            if(!locked){
              // RENAME map within series
              lrow.querySelector('.lvName').addEventListener('click', e=>{
                e.stopPropagation();
                showRenamePopup(lrow.querySelector('.lvName'), l.name, newName=>{
                  const t=savedSeries().find(x=>x.name===s.name);
                  if(!t) return;
                  const oldName = l.name;
                  t.levels[i].name = newName;
                  saveSeries(t);
                  // Also rename in standalone saved levels if present
                  const allLevels = savedLevels();
                  const entry = allLevels.find(lv=>lv.name===oldName);
                  if(entry){ entry.name=newName; LS.set('cc_levels', JSON.stringify(allLevels)); upsertMapToCloud(entry).catch(()=>{}); }
                  rebuildLvList();
                  showBuilderToast(`Renamed to "${newName}"`);
                });
              });
              lrow.addEventListener('dragstart',e=>{ dragSrcIdx=i; lrow.style.opacity='0.4'; e.dataTransfer.effectAllowed='move'; });
              lrow.addEventListener('dragend',()=>{ lrow.style.opacity='1'; dragSrcIdx=null; });
              lrow.addEventListener('dragover',e=>{ e.preventDefault(); lrow.style.borderColor='#ffd700'; });
              lrow.addEventListener('dragleave',()=>{ lrow.style.borderColor='#333'; });
              lrow.addEventListener('drop',e=>{
                e.preventDefault(); lrow.style.borderColor='#333';
                if(dragSrcIdx===null||dragSrcIdx===i) return;
                const t=savedSeries().find(x=>x.name===s.name);
                const moved=t.levels.splice(dragSrcIdx,1)[0]; t.levels.splice(i,0,moved);
                saveSeries(t); rebuildLvList();
              });
              lrow.querySelector('.smLoadLv').addEventListener('click',()=>{ ov.remove(); loadLevelIntoBuilder(l); showBuilderToast(`Loaded "${l.name||'Level'}"`); });
              lrow.querySelector('.smRemoveLv').addEventListener('click',()=>{
                const t=savedSeries().find(x=>x.name===s.name); t.levels.splice(i,1); saveSeries(t); rebuildLvList();
              });
            }
            lvList.appendChild(lrow);
          });
          hdr2.querySelector('.seriesCount').textContent=`${s.levels.length} map${s.levels.length!==1?'s':''}`;
        }
        rebuildLvList();
        if(!locked) row.appendChild(lvList);

        // + Add Maps button at bottom of each non-locked series
        if(!locked){
          const addMapsBtn = document.createElement('button');
          addMapsBtn.style.cssText = `background:none;border:1px dashed rgba(46,196,182,0.35);color:#2ec4b6;font-family:'Lato',sans-serif;font-weight:700;font-size:13px;padding:8px;cursor:pointer;border-radius:3px;width:100%;margin-top:2px;`;
          addMapsBtn.textContent = '+ Add Maps';
          addMapsBtn.addEventListener('click', ()=>{ showAddMapsToSeriesOverlay(s.name, rebuildLvList); });
          row.appendChild(addMapsBtn);
        }

        // Publish/unpublish series (any user, non-featured)
        if(!isFeatured){
          const pubBtn = hdr2.querySelector('.usPublish');
          if(pubBtn) pubBtn.addEventListener('click', async e => {
            e.stopPropagation();
            const newVal = !s.is_public;
            let slug = s.slug;
            if(!slug){
              try { slug = await shareSeriesToCloud(s); s.slug = slug; } catch(err){}
            }
            if(slug){
              await publishSeries(slug, newVal);
              s.is_public = newVal;
              saveSeries(s);
              renderSeriesTab();
              showBuilderToast(newVal ? '🌐 Series is now public' : 'Series set to private');
            } else {
              showBuilderToast('Could not publish - try sharing first');
            }
          });
        }

        // Push to cloud (admin only, featured series only)
        if(isFeatured && adminMode){
          hdr2.querySelector('.usPush').addEventListener('click', async ()=>{
            const btn=hdr2.querySelector('.usPush');
            const orig=btn.innerHTML; btn.innerHTML='⏳'; btn.disabled=true;
            try {
              const fresh=savedSeries().find(x=>x.name===s.name)||s;
              await upsertCloudSeries(fresh, 0);
              showBuilderToast('☁ Quest pushed to cloud!');
            } catch(e){ showBuilderToast('⚠️ Push failed'); console.error(e); }
            finally { btn.innerHTML=orig; btn.disabled=false; }
          });
        }

        // Set as Featured: long-press the series row (admin only, non-featured)
        if(!isFeatured && adminMode){
          let pressTimer=null;
          const startPress=()=>{ pressTimer=setTimeout(()=>{
            showConfirmOverlay(
              `Set "${s.name}" as the Featured series?`,
              ()=>{
                setFeaturedSeriesName(s.name);
                renderSeriesTab();
                showBuilderToast(`★ "${s.name}" is now the Featured series`);
              },
              'YES', 'CANCEL'
            );
          }, 600); };
          const cancelPress=()=>{ clearTimeout(pressTimer); };
          row.addEventListener('pointerdown', startPress);
          row.addEventListener('pointerup', cancelPress);
          row.addEventListener('pointerleave', cancelPress);
          row.title='Hold to set as Featured';
        }

        // Rename (not available for locked featured series)
        if(!locked){
          hdr2.querySelector('.usName').addEventListener('click', ()=>{
            showRenamePopup(hdr2.querySelector('.usName'), s.name, newName=>{
              const allSeries = savedSeries();
              const target = allSeries.find(x=>x.name===s.name);
              if(!target) return;
              const oldName = target.name;
              target.name = newName;
              LS.set('cc_series', JSON.stringify(allSeries.map(x=>x.name===oldName ? target : x)));
              if(isFeatured){ const hc=HARDCODED_SERIES.find(x=>x.name===oldName); if(hc) hc.name=newName; }
              renderSeriesTab();
              showBuilderToast(`Renamed to "${newName}"`);
            });
          });
        }

        // Share
        hdr2.querySelector('.usShare').addEventListener('click', async ()=>{
          const btn=hdr2.querySelector('.usShare'); const orig=btn.innerHTML; btn.innerHTML='⏳'; btn.disabled=true;
          try {
            let slug;
            try { slug = await shareSeriesToCloud(s); }
            catch(uploadErr){ console.warn('Series cloud upload failed, using local slug:', uploadErr); slug = slugify(s.name); }
            showShareLinkOverlay('SERIES SHARED!', getSeriesShareUrl(slug));
          } catch(e){ console.error('Series share failed:', e); showBuilderToast('⚠️ Share failed: ' + (e && e.message ? e.message.slice(0,60) : 'unknown error')); }
          finally { btn.innerHTML=orig; btn.disabled=false; }
        });

        // Delete (not available for locked featured series)
        if(!locked){
          hdr2.querySelector('.usDel').addEventListener('click',()=>{
            const ownedNames = new Set(savedLevels().map(l=>l.name));
            const total = s.levels.length;
            const owned = s.levels.filter(l=>ownedNames.has(l.name)).length;
            const unowned = total - owned;
            let msg = `Delete series <strong style="color:#f5c842;">${s.name}</strong>?`;
            if(total > 0){
              msg += `<div style="color:#aaa;font-size:13px;margin-top:8px;line-height:1.6;">This will remove ${total} map${total!==1?'s':''} from your list.`;
              if(unowned > 0) msg += `<br><span style="color:rgba(200,160,60,0.6);font-size:12px;">${unowned} shared map${unowned!==1?'s':''} will only be removed locally.</span>`;
              msg += `</div>`;
            }
            showConfirmOverlay(msg, ()=>{
              // Delete each map locally; cloud delete only for owned maps
              s.levels.forEach(l=>{
                deleteLevel(l.name);
                if(ownedNames.has(l.name)) deleteCloudMapByName(l.name).catch(()=>{});
              });
              deleteSeries(s.name);
              rebuildSeriesTab();
              showBuilderToast(`"${s.name}" deleted`);
            });
          });
        }

        body.appendChild(row);
      });
    }

    // New series button
    const newBtn=document.createElement('button');
    newBtn.style.cssText=`background:none;border:1px dashed rgba(200,160,60,0.3);color:#888;font-family:'Lato',sans-serif;font-weight:700;font-size:14px;padding:12px;cursor:pointer;border-radius:3px;margin-top:6px;`;
    newBtn.textContent='+ New Series';
    newBtn.addEventListener('click',()=>{
      const nameIn=prompt('Series name:'); if(!nameIn||!nameIn.trim()) return;
      const desc=prompt('Description (optional):') || '';
      saveSeries({name:nameIn.trim(),description:desc,levels:[]});
      rebuildSeriesTab();
      showBuilderToast(`Series "${nameIn.trim()}" created!`);
    });
    body.appendChild(newBtn);
  }

  tabMaps.addEventListener('click', renderMapsTab);
  tabSeries.addEventListener('click', renderSeriesTab);
}

function showAddMapsToSeriesOverlay(seriesName, onDone){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;';

  const panel = document.createElement('div');
  panel.style.cssText = "background:#0f0f1a;border:2px solid rgba(200,160,60,0.5);font-family:'Lato',sans-serif;width:min(440px,100%);max-height:90vh;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;";

  // Header
  const hdr = document.createElement('div');
  hdr.style.cssText = "padding:16px 16px 10px;border-bottom:1px solid rgba(200,160,60,0.2);flex-shrink:0;";
  hdr.innerHTML = `<div style="color:#f5c842;font-size:15px;font-family:'Cinzel',serif;font-weight:600;text-align:center;margin-bottom:4px;">ADD MAPS TO SERIES</div>
    <div style="color:#888;font-size:12px;text-align:center;">Tap thumbnails to add to <span style="color:#f5c842;">${seriesName}</span></div>`;
  panel.appendChild(hdr);

  // Thumbnail grid
  const grid = document.createElement('div');
  grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;padding:14px;overflow-y:auto;flex:1;justify-content:flex-start;align-content:flex-start;';

  const saved = savedLevels();
  const savedNames = new Set(saved.map(l=>l.name));
  const fromSeries = [];
  savedSeries().forEach(s=>{ s.levels.forEach(l=>{ if(!savedNames.has(l.name)){ fromSeries.push(l); savedNames.add(l.name); } }); });
  const allMaps = [...saved, ...fromSeries];

  // Get maps already in this series
  const targetSeries = savedSeries().find(s=>s.name===seriesName);
  const alreadyIn = new Set((targetSeries?.levels||[]).map(l=>l.name));

  const selected = new Set(alreadyIn); // start with already-added maps checked

  if(!allMaps.length){
    const empty = document.createElement('div');
    empty.style.cssText = "color:#555;font-size:14px;padding:30px;text-align:center;width:100%;";
    empty.textContent = 'No maps yet. Start building.';
    grid.appendChild(empty);
  } else {
    allMaps.forEach(lv => {
      const card = document.createElement('div');
      const inSeries = alreadyIn.has(lv.name);
      card.style.cssText = `display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;width:calc(33.3% - 8px);min-width:80px;padding:6px;border-radius:4px;border:2px solid ${inSeries ? '#f5c842' : 'rgba(255,255,255,0.08)'};background:${inSeries ? 'rgba(245,200,66,0.08)' : 'rgba(255,255,255,0.03)'};box-sizing:border-box;transition:border-color 0.15s,background 0.15s;-webkit-tap-highlight-color:transparent;`;
      card.dataset.name = lv.name;

      // Thumbnail canvas
      const thumb = document.createElement('canvas');
      const TW = 80, TH = 72;
      thumb.width = TW; thumb.height = TH;
      thumb.style.cssText = 'border-radius:2px;display:block;width:100%;';

      // Draw thumbnail
      const tc = thumb.getContext('2d');
      tc.fillStyle = '#0a0a14';
      tc.fillRect(0,0,120,TH);
      if(lv.bricks && lv.bricks.length){
        const cols = BRICK_COLS, rows = BRICK_ROWS;
        const bw = TW/cols, bh = TH/rows;
        lv.bricks.forEach(b=>{
          const col = b.col !== undefined ? b.col : Math.round(b.x/(b.w||BRICK_W));
          const row = b.row !== undefined ? b.row : Math.round(b.y/(b.h||BRICK_H));
          if(col<0||col>=cols||row<0||row>=rows) return;
          let color = b.color || '#888';
          if(b.isSteel)   color = '#8a9bb0';
          else if(b.isDiamond) color = '#00eeff';
          else if(b.isKey)    color = '#ffd700';
          else if(b.isLock)   color = '#b8860b';
          else if(b.isSkull)  color = '#333';
          else if(b.isBomb)   color = '#ff6600';
          else if(b.isReverse) color = '#9966cc';
          else if(b.isWhite)  color = '#e8e8f0';
          tc.fillStyle = b.isPaint ? color + 'aa' : color;
          tc.fillRect(col*bw+0.5, row*bh+0.5, bw-1, bh-1);
        });
      }

      // Checkmark overlay
      const check = document.createElement('div');
      check.style.cssText = `position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:#f5c842;color:#000;font-size:11px;font-weight:700;display:${inSeries?'flex':'none'};align-items:center;justify-content:center;`;
      check.textContent = '✓';

      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;width:100%;';
      wrap.appendChild(thumb);
      wrap.appendChild(check);
      card.appendChild(wrap);

      const label = document.createElement('div');
      label.style.cssText = "color:#c9a84c;font-size:10px;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Lato',sans-serif;";
      label.textContent = lv.name;
      card.appendChild(label);

      card.addEventListener('click', ()=>{
        if(selected.has(lv.name)){
          selected.delete(lv.name);
          card.style.borderColor = 'rgba(255,255,255,0.08)';
          card.style.background = 'rgba(255,255,255,0.03)';
          check.style.display = 'none';
        } else {
          selected.add(lv.name);
          card.style.borderColor = '#f5c842';
          card.style.background = 'rgba(245,200,66,0.08)';
          check.style.display = 'flex';
        }
      });

      grid.appendChild(card);
    });
  }
  panel.appendChild(grid);

  // Footer
  const footer = document.createElement('div');
  footer.style.cssText = 'padding:12px 14px;border-top:1px solid rgba(200,160,60,0.15);display:flex;gap:8px;flex-shrink:0;';
  const doneBtn = document.createElement('button');
  doneBtn.style.cssText = "flex:1;background:#2ec4b6;border:none;color:#000;font-family:'Lato',sans-serif;font-weight:700;font-size:14px;padding:11px;cursor:pointer;border-radius:3px;";
  doneBtn.textContent = 'Done';
  const cancelBtn = document.createElement('button');
  cancelBtn.style.cssText = "background:none;border:1px solid #444;color:#666;font-family:'Lato',sans-serif;font-weight:700;font-size:14px;padding:11px 16px;cursor:pointer;border-radius:3px;flex-shrink:0;";
  cancelBtn.textContent = 'Cancel';

  doneBtn.addEventListener('click', ()=>{
    const target = savedSeries().find(s=>s.name===seriesName);
    if(target){
      // Replace levels list with the selected set, preserving order of existing + appending new
      const existingOrder = target.levels.map(l=>l.name);
      const allMapsByName = {};
      allMaps.forEach(l=>{ allMapsByName[l.name]=l; });
      // Keep existing in order if still selected, then append newly added
      const kept = existingOrder.filter(n=>selected.has(n));
      const added = [...selected].filter(n=>!existingOrder.includes(n));
      target.levels = [...kept, ...added].map(n=>allMapsByName[n]).filter(Boolean);
      saveSeries(target);
      const addedCount = added.length;
      const removedCount = existingOrder.filter(n=>!selected.has(n)).length;
      let msg = addedCount ? `${addedCount} map${addedCount!==1?'s':''} added to "${seriesName}"` : `Series updated`;
      if(removedCount) msg += `, ${removedCount} removed`;
      showBuilderToast(msg);
    }
    ov.remove();
    if(onDone) onDone();
  });

  cancelBtn.addEventListener('click', ()=>ov.remove());
  footer.appendChild(doneBtn);
  footer.appendChild(cancelBtn);
  panel.appendChild(footer);

  ov.appendChild(panel);
  ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
}

document.getElementById('builderClearBtn').addEventListener('click',()=>{
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML=`<div style="background:#0f0f1a;border:2px solid #444;padding:24px;font-family:'Press Start 2P',monospace;text-align:center;">
    <div style="color:#fff;font-size:9px;line-height:2">Clear the whole map?</div>
    <div style="display:flex;gap:12px;margin-top:16px;justify-content:center;">
      <button id="clearYes" style="background:#e63946;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 14px;cursor:pointer;border-radius:3px;">CLEAR</button>
      <button id="clearNo" style="background:#1a1a2e;border:2px solid #444;color:#fff;font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 14px;cursor:pointer;border-radius:3px;">CANCEL</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#clearYes').addEventListener('click',()=>{
    overlay.remove();
    builderBricks = buildSteelPerimeter();
    builderBallPos={ col:Math.floor(BRICK_COLS/2), row:Math.floor(BRICK_ROWS/2) };
    builderPortalPos=null;
    builderCurrentLevelName=null;
    drawBuilder();
  });
  overlay.querySelector('#clearNo').addEventListener('click',()=>{ overlay.remove(); });
});

document.getElementById('builderExitBtn').addEventListener('click',()=>{
  // Show an inline exit confirmation inside the builder
  const overlay=document.createElement('div');

function hasPerimeterExit(bricks) {
  // Check every perimeter cell - if any cell has no brick OR has a non-steel brick, there's a potential exit
  // A lock counts as an exit (player can open it with a key)
  for (let c = 0; c < BRICK_COLS; c++) {
    for (const r of [0, BRICK_ROWS-1]) {
      const b = bricks.find(b => b.col === c && b.row === r);
      if (!b || !b.isSteel) return true;
    }
  }
  for (let r = 1; r < BRICK_ROWS-1; r++) {
    for (const c of [0, BRICK_COLS-1]) {
      const b = bricks.find(b => b.col === c && b.row === r);
      if (!b || !b.isSteel) return true;
    }
  }
  return false;
}

        <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(200,160,60,0.3),transparent);width:100%;margin:4px 0;"></div>
      </div>`
    : '';
  if(inSeries && !hasNext && activeSeries) saveSeriesProgress(activeSeries.name, activeSeries.levels.length - 1);

  // Advance quest if player just completed a quest series
  if(inSeries && !hasNext && activeSeries && isSeriesInQuest(activeSeries.name)) {
    const questOrder = getQuestOrder();
    const currentIdx = getCurrentQuestIndex();
    if(questOrder[currentIdx] === activeSeries.name) {
      const nextQuestName = advanceQuest();
      if(nextQuestName) {
        setTimeout(() => showToast(`🏆 Quest unlocked: ${nextQuestName}!`, '#00eeff'), 1500);
      }
    }
  }

  // Middle CTA:
  // - Challenge map → MAKE IT HARDER as primary red CTA
  // - Creator of this map → share it and challenge a friend
  // - Non-creator (played a received/series map) → prompt to build their own
  // - Series complete → prompt to build their own
  const isReceivedMap = currentLevelData && currentLevelData.creator_id && currentLevelData.creator_id !== CREATOR_ID;
  const isSeriesComplete = inSeries && !hasNext;
  const isChallengeMap = !!activeChallengeCtx;
  const showBuildPrompt = !isChallengeMap && (isReceivedMap || isSeriesComplete) && isUnlocked('full_builder');
  const buildPromptMsgs = [
    'Now build your own 🔨',
    'Think you can build a harder one? 🔨',
    'Your turn to build 🔨',
    'Make one that beats this 🔨',
  ];
  const buildPromptLabel = isSeriesComplete ? 'BUILD YOUR OWN SERIES 🔨' : buildPromptMsgs[Math.floor(Math.random() * buildPromptMsgs.length)];
  const isRandomMode = !currentLevelData || !currentLevelData.name;

  const middleBtn = isChallengeMap
    ? `<button id="endChallengeFireBackBtn" style="${btnStyle('#e63946','rgba(50,5,5,0.98)')}">🔥 MAKE IT HARDER</button>`
    : isRandomMode
      ? `` // no middle button for random mode
      : showBuildPrompt
        ? `<button id="endBuildBtn" style="${btnStyle('#f5c842', isSeriesComplete ? 'rgba(60,44,8,0.98)' : 'rgba(40,28,5,0.95)')}">${buildPromptLabel}</button>`
        : `<button id="endShareBtn" style="${btnStyle('#f5c842','rgba(40,28,5,0.95)')}">SHARE THIS MAP</button>`;

  // Always show the 3 CTAs on a win (except when testing in builder)
  let buttons='';
  if(testingLevel){
    buttons=`<button id="backToBuilderBtn" style="${btnStyle('#2ec4b6','rgba(5,30,30,0.9)')}">↩ Back to Builder</button>`;
  } else if(isChallengeMap){
    buttons=`
      ${middleBtn}
      <button id="endPlayAgainBtn" style="${btnStyle(titleColor,'rgba(10,15,30,0.95)')}">↺ Play It Again</button>
      <button id="endMenuBtn" style="${ghostBtn}">Home</button>
    `;
  } else if(isRandomMode){
    buttons=`
      <button id="endNextBtn" style="${btnStyle('#2ec4b6','rgba(5,25,28,0.95)')}">▶ Play Another</button>
      <button id="endPlayAgainBtn" style="${btnStyle(titleColor,'rgba(10,15,30,0.95)')}">↺ Play It Again</button>
      <button id="endMenuBtn" style="${ghostBtn}">Home</button>
    `;
  } else {
    buttons=`
      ${hasNext ? `<button id="endNextBtn" style="${btnStyle('#2ec4b6','rgba(5,25,28,0.95)')}">▶ Next Level</button>` : ''}
      ${middleBtn}
      <button id="endPlayAgainBtn" style="${btnStyle(titleColor,'rgba(10,15,30,0.95)')}">↺ Play It Again</button>
      <button id="endMenuBtn" style="${ghostBtn}">Home</button>
    `;
  }

  // Build win card - record info injected async after render
  const recordPlaceholder = `<div id="recordDisplay" style="color:rgba(180,150,80,0.5);font-size:11px;font-family:'Cinzel',serif;letter-spacing:0.5px;text-align:center;min-height:16px;"></div>`;

  showMessage(card(`
    <div style="font-size:38px;filter:drop-shadow(0 0 10px ${titleGlow})">${icon}</div>
    <div style="font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:${titleColor};letter-spacing:1px;text-shadow:0 0 12px ${titleGlow}">${titleText}</div>
    <div style="color:rgba(180,150,80,0.7);font-size:12px">${subText}</div>
    ${diamondTally}
    ${guardReward}
    ${seriesInfo}
    ${seriesCompleteBanner}
    <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(180,140,50,0.3),transparent);width:100%;margin:2px 0;"></div>
    <div style="display:flex;justify-content:center;">
      <div style="text-align:center;"><div style="color:rgba(180,150,80,0.5);font-size:10px;font-family:'Cinzel',serif;letter-spacing:1px;margin-bottom:3px">YOUR TIME</div>
           <div style="color:#e8d5a0;font-size:20px;font-weight:700">${timeStr}</div></div>
    </div>
    ${recordPlaceholder}
    <div style="display:flex;flex-direction:column;gap:8px;width:100%;margin-top:4px;">
      ${buttons}
    </div>
  `));

  // Fetch record async and update display
  const mapSlug = currentLevelData && currentLevelData.name
    ? null // will be fetched via upsertMapToCloud slug
    : null;

  // Show star rating for any map/series the player didn't create, not testing
  const isOwnMap = currentLevelData && currentLevelData.creator_id === CREATOR_ID;
  const isOwnSeries = activeSeries && activeSeries.creator_id === CREATOR_ID;
  const isQuestMap = activeSeries && isSeriesInQuest(activeSeries.name);
  const shouldRateMap = !testingLevel && !isOwnMap && !isChallengeMap && !isQuestMap && currentLevelData && currentLevelData.name && !isSeriesComplete;
  const shouldRateSeries = !testingLevel && !isChallengeMap && !isQuestMap && isSeriesComplete && activeSeries && !isOwnSeries;

  // Only track records for named maps (not random games)
  if(!testingLevel && !isChallengeMap && currentLevelData && currentLevelData.name){
    (async ()=>{
      // Use stored slug directly if available, fall back to name lookup
      let slug = currentLevelData.slug || null;
      if(!slug){
        try {
          // Look up by slug or name without creator filter - works for any public map
          const existing = await fetch(`${SUPA_URL}/rest/v1/maps?name=eq.${encodeURIComponent(currentLevelData.name)}&select=slug,creator_id&limit=1`, {
            headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
          });
          if(existing.ok){ const rows=await existing.json(); if(rows.length){ slug=rows[0].slug; currentLevelData.slug=slug; } }
        } catch(e){ console.warn('Slug lookup failed:', e); }
      }
      // If still no slug and we own the map, upload it to get one
      if(!slug && (!currentLevelData.creator_id || currentLevelData.creator_id === CREATOR_ID)){
        try {
          slug = await upsertMapToCloud(currentLevelData);
          currentLevelData.slug = slug;
        } catch(e){ console.warn('Map upload for record failed:', e); }
      }

      if(!slug){ console.log('No slug found for map, skipping record'); return; }

      // Award diamonds on completion
      // Auto-generated arcade maps award every time; named maps award once per slug
      const isRandomGame = !currentLevelData || !currentLevelData.name;
      const alreadyCompleted = !isRandomGame && hasCompletedMap(slug);
      if (!testingLevel && !alreadyCompleted) {
        const diamondsInMap = currentLevelData.bricks ? currentLevelData.bricks.filter(b => b.isDiamond).length : 0;
        let diamondsEarned = diamondsInMap;
        // Blackout gets flat 5
        if (gameMode === 'blackout') diamondsEarned = 5;
        // Loot mode: earn exactly what you collected (you grabbed it all to win)
        if (gameMode === 'loot') diamondsEarned = diamondsCollected;
        // Escape mode: earn diamonds collected + 1 escape bonus
        if (gameMode === 'escape' && diamondsInMap > 0) {
          diamondsEarned = diamondsCollected + 1;
        } else if (gameMode === 'escape') {
          diamondsEarned = 1;
        }
        // Cap challenge diamonds
        if (isChallengeMap) diamondsEarned = Math.min(diamondsEarned, CHALLENGE_DIAMOND_CAP);
        diamondsEarned = Math.max(diamondsEarned, 1);
        // Only mark named maps as completed (not random arcade games)
        if (!isRandomGame) markMapCompleted(slug);
        const newTotal = addDiamonds(diamondsEarned);
        updateTotalDiamondDisplay();
        setTimeout(() => showDiamondAlert(diamondsEarned), 800);
      }

      const record = await fetchRecord(slug);
      const recordEl = document.getElementById('recordDisplay');
      if(!recordEl) return;

      const isNewRecord = !record || elapsed < record.time_seconds;

      if(isNewRecord){
        // New record!
        recordEl.innerHTML = `<span style="color:#f5c842;font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.5px;">🏆 New Time to Beat!</span>`;
        promptInitialsAndSaveRecord(slug, elapsed, ()=>{
          const name = _currentUser ? getDisplayName() : getStoredInitials();
          if(recordEl) recordEl.innerHTML = `<span style="color:#f5c842;font-size:12px;font-family:'Cinzel',serif;">🏆 Time to Beat: <strong>${name}</strong> — ${formatTime(elapsed)}</span>`;
        });
      } else {
        // Show current record
        recordEl.innerHTML = `<span style="color:rgba(180,150,80,0.6);font-size:11px;font-family:'Cinzel',serif;">Time to Beat: <strong style="color:#e8d5a0;">${record.initials}</strong> — ${formatTime(record.time_seconds)}</span>`;
      }
    })();
  }

  if(testingLevel){
    document.getElementById('backToBuilderBtn').addEventListener('click',()=>{
      goBackToBuilder();
    });
    return;
  }

  // Rating triggers - only show if not already rated
  if (shouldRateMap) {
    setTimeout(async () => {
      const slug = currentLevelData.slug;
      if (!slug) return;
      const existing = await fetchMyRating(slug, 'map').catch(() => null);
      if (!existing) showStarRating(slug, 'map', null);
    }, 1200);
  } else if (shouldRateSeries) {
    setTimeout(async () => {
      const slug = activeSeries.slug;
      if (!slug) return;
      const existing = await fetchMyRating(slug, 'series').catch(() => null);
      if (!existing) showStarRating(slug, 'series', null);
    }, 1500);
  }

  // Next Level / Play Another
  if(document.getElementById('endNextBtn')){
    document.getElementById('endNextBtn').addEventListener('click',()=>{
      if(isRandomMode){
        hideMessage();
        startGame(null, gameMode);
      } else if(hasNext){
        activeSeriesIdx++;
        hideMessage();
        startGame(activeSeries.levels[activeSeriesIdx]);
      } else {
        activeSeries=null; activeSeriesIdx=0;
        hideMessage(); showModeSelect();
      }
    });
  }

  // Build Your Own (shown instead of share on received maps)
  if(document.getElementById('endBuildBtn')){
    document.getElementById('endBuildBtn').addEventListener('click',()=>{
      if(!isUnlocked('full_builder')){ showSpendConfirm('full_builder', 'Design', ()=>{ hideMessage(); openBuilder(); }); return; }
      hideMessage(); openBuilder();
    });
  }

  // Challenge - Make It Harder
  if(document.getElementById('endChallengeFireBackBtn')){
    // Mark beaten immediately - don't wait for button tap
    if(activeChallengeCtx) {
      const { chainId, round, challengeId } = activeChallengeCtx;
      markChallengeBeaten(challengeId).catch(() => {});
      // Update local cache right away so it leaves the list
      try {
        const all = getLocalChallenges();
        const entry = all.find(c => c.chainId === chainId && c.round === round);
        if (entry) { entry.beaten = true; LS.set('pb_challenges', JSON.stringify(all)); }
      } catch(e) {}
    }

    document.getElementById('endChallengeFireBackBtn').addEventListener('click',()=>{
      if(!activeChallengeCtx) return;
      const { chainId, round, challengeId, senderCreatorId } = activeChallengeCtx;
      const capturedLevel = currentLevelData;
      requireSignIn(() => {
        activeChallengeCtx = null;
        showChallengeWinCTA(chainId, round, challengeId, senderCreatorId, capturedLevel);
      });
    });
  }

  if(document.getElementById('endShareBtn')){
    document.getElementById('endShareBtn').addEventListener('click', async ()=>{
      const btn = document.getElementById('endShareBtn');
      const orig = btn.innerHTML; btn.innerHTML='⏳'; btn.disabled=true;
      try {
        const levelToShare = currentLevelData;
        if(!levelToShare || !levelToShare.name){ showToast('⚠️ Can\'t share random maps - save it first!'); btn.innerHTML=orig; btn.disabled=false; return; }
        let slug;
        try {
          slug = await upsertMapToCloud(levelToShare);
        } catch(uploadErr){
          console.warn('Cloud upload failed, using local slug:', uploadErr);
          slug = slugify(levelToShare.name);
        }
        showShareLinkOverlay('MAP SHARED!', getShareUrl(slug), levelToShare);
      } catch(e){
        console.error('Share failed:', e);
        showToast('⚠️ Share failed: ' + (e && e.message ? e.message.slice(0,60) : 'unknown error'));
      } finally {
        if(document.getElementById('endShareBtn')){ btn.innerHTML=orig; btn.disabled=false; }
      }
    });
  }

  // Play It Again
  document.getElementById('endPlayAgainBtn').addEventListener('click',()=>{
    hideMessage();
    restartGame();
  });

  // Home
  document.getElementById('endMenuBtn').addEventListener('click',()=>{
    activeSeries=null; activeSeriesIdx=0;
    activeChallengeCtx=null;
    hideMessage(); showModeSelect();
  });
}

// Message box tap - handle "tap to play again" when game is over
msgBox.addEventListener('click',(e)=>{
  if(e.target.closest('button,#endQuitBtn,#nextLevelBtn,#endNextBtn,#endShareBtn,#backToBuilderBtn,#endPlayAgainBtn,#endMenuBtn,#gameOverRetryBtn,#gameOverMenuBtn,#endChallengeFireBackBtn')) return;
  if(!gameOver) return;
  if(isRespawning) return; // respawn handler takes over
  if(testingLevel) return;
  // Tap outside = go home
  activeSeries=null; activeSeriesIdx=0;
  activeChallengeCtx=null;
  hideMessage(); showModeSelect();
});

// Single unified canvas click handler
canvas.addEventListener('click',()=>{
  if(builderOpen) return;
  if(msgBox.style.display==='block') return; // message handles its own clicks
  if(!gameRunning) return;
  if(!paused&&!ballLaunched) launchBall();
});

function getSeriesProgress(seriesName){
  try { return parseInt(localStorage.getItem('pb_progress_'+seriesName)||'0'); } catch(e){ return 0; }
}
function saveSeriesProgress(seriesName, idx){
  try { localStorage.setItem('pb_progress_'+seriesName, idx); } catch(e){}
}
function clearSeriesProgress(seriesName){
  try { localStorage.removeItem('pb_progress_'+seriesName); } catch(e){}
}

function playSeries(s, fromIdx){
  activeSeries=s;
  activeSeriesIdx = fromIdx !== undefined ? fromIdx : getSeriesProgress(s.name);
  if(activeSeriesIdx >= s.levels.length) activeSeriesIdx=0;
  startGame(s.levels[activeSeriesIdx]);
}

// =====================================================================
function getShownTips() {
  try { return new Set(JSON.parse(LS.get('pb_shown_tips') || '[]')); } catch(e) { return new Set(); }
}
function markTipShown(tipId) {
  const shown = getShownTips();
  shown.add(tipId);
  LS.set('pb_shown_tips', JSON.stringify([...shown]));
}
function hasTipShown(tipId) {
  return getShownTips().has(tipId);
}

let _tipQueue = [];
let _tipShowing = false;

function queueBrickTip(tipId, imgSrc, title, body) {
  if (hasTipShown(tipId)) return;
  if (gameMode === 'blackout') return; // no tips in Prism Guard
  markTipShown(tipId);
  _tipQueue.push({ tipId, imgSrc, title, body });
  if (!_tipShowing) showNextTip();
}

function showNextTip() {

// =====================================================================

async function fetchCloudSeries() {
  const res = await fetch(`${SUPA_URL}/rest/v1/series?select=*&order=sort_order.asc`, {
    headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
  });
  if (!res.ok) throw new Error('Failed to fetch series');
  return await res.json();
}

async function upsertCloudSeries(series, sortOrder) {
  const slug = series.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const payload = {
    slug,
    name: series.name,
    description: series.description || '',
    levels: series.levels,
    sort_order: sortOrder
  };

  // Try PATCH first (update existing row by slug)
  const patch = await fetch(`${SUPA_URL}/rest/v1/series?slug=eq.${encodeURIComponent(slug)}`, {
    method: 'PATCH',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPA_KEY,
      'Authorization': `Bearer ${SUPA_KEY}`,
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ name: series.name, description: series.description || '', levels: series.levels, sort_order: sortOrder })
  });
  if (patch.ok) {
    return { slug, name: series.name }; // PATCH worked - return immediately
  }

  // Row doesn't exist yet - INSERT
  const post = await fetch(`${SUPA_URL}/rest/v1/series`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPA_KEY,
      'Authorization': `Bearer ${SUPA_KEY}`,
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(payload)
  });
  if (!post.ok) { const e = await post.text(); throw new Error(e); }
  return await post.json();
}

// Featured series name - persisted so it survives reloads
function getFeaturedSeriesName(){
  // Return the current active quest based on player progress
  const questOrder = getQuestOrder();
  if (!questOrder.length) return LS.get('pb_featured_series') || '';
  const questIdx = getCurrentQuestIndex();
  return questOrder[questIdx] || questOrder[questOrder.length - 1];
}

function getQuestOrder() {
  try { return JSON.parse(LS.get('pb_quest_order') || '[]'); } catch(e) { return []; }
}
function setQuestOrder(order) {
  LS.set('pb_quest_order', JSON.stringify(order));
  if (adminMode) syncQuestOrderToCloud(order).catch(() => {});
}
function getCurrentQuestIndex() {
  return parseInt(LS.get('pb_quest_index') || '0', 10);
}
function advanceQuest() {
  const order = getQuestOrder();
  const current = getCurrentQuestIndex();
  if (current < order.length - 1) {
    LS.set('pb_quest_index', String(current + 1));
    syncProgressToCloud().catch(() => {});
    return order[current + 1];
  }
  return null; // all quests complete
}
function isSeriesInQuest(seriesName) {
  return getQuestOrder().includes(seriesName);
}
function addSeriesToQuest(seriesName) {
  const order = getQuestOrder();
  if (!order.includes(seriesName)) {
    order.push(seriesName);
    setQuestOrder(order);
  }
}
function removeSeriesFromQuest(seriesName) {
  const order = getQuestOrder().filter(n => n !== seriesName);
  setQuestOrder(order);
}
function setFeaturedSeriesName(name){
  LS.set('pb_featured_series', name);
  // Reorder HARDCODED_SERIES so featured is always index 0
  const idx = HARDCODED_SERIES.findIndex(s=>s.name===name);
  if(idx>0){
    const [featured] = HARDCODED_SERIES.splice(idx,1);
    HARDCODED_SERIES.unshift(featured);
  }
  // Sync the new order to cloud so all players get it
  if(adminMode){
    const newOrder = HARDCODED_SERIES.map(s=>s.name);
    setQuestOrder(newOrder);
    syncQuestOrderToCloud(newOrder)
      .then(()=>showToast('☁ Quest order saved to cloud', '#00eeff'))
      .catch(e=>{ console.error('Quest sync failed', e); showToast('⚠️ Cloud sync failed', '#e63946'); });
  }
}

async function fetchRecord(slug){

      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }

async function saveRecord(slug, initials, timeSeconds){
  try {
    const current = await fetchRecord(slug);
    if(current && current.time_seconds <= timeSeconds){
      return;
    }

    const payload = { initials, time_seconds: timeSeconds };
    if (_currentUser) payload.creator_id = CREATOR_ID;

    if(current){
      const patch = await fetch(`${SUPA_URL}/rest/v1/records?slug=eq.${encodeURIComponent(slug)}`, {
        method: 'PATCH',
        headers: { 'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal' },
        body: JSON.stringify(payload)
      });
      if(!patch.ok) { const e=await patch.text(); console.error('Record update failed:', e); showToast('⚠️ Record save failed: ' + e.slice(0,60)); }
    } else {
      payload.slug = slug;
      const post = await fetch(`${SUPA_URL}/rest/v1/records`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal' },
        body: JSON.stringify(payload)
      });
      if(!post.ok) { const e=await post.text(); console.error('Record insert failed:', e); showToast('⚠️ Record save failed: ' + e.slice(0,60)); }
    }
  } catch(e){ console.warn('Record save failed:', e); showToast('⚠️ Record save error'); }
}

function formatTime(seconds){
  const m = Math.floor(seconds/60);
  const s = (seconds%60).toFixed(1).padStart(4,'0');
  return m > 0 ? `${m}:${s}` : `${seconds.toFixed(1)}s`;
}

}

async function fetchPublicSeries() {
  try {
    const [seriesRes, ratingsRes] = await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/series?is_public=eq.true&select=slug,name,description,levels,sort_order,creator_id`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
      }),
      fetch(`${SUPA_URL}/rest/v1/ratings?type=eq.series&select=slug,rating`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
      })
    ]);
    if (!seriesRes.ok) return [];
    const series = await seriesRes.json();
    const ratings = ratingsRes.ok ? await ratingsRes.json() : [];

    // Compute avg rating per slug
    const ratingMap = {};
    ratings.forEach(r => {
      if (!ratingMap[r.slug]) ratingMap[r.slug] = [];
      ratingMap[r.slug].push(r.rating);
    });

    return series.map(s => {
      const rs = ratingMap[s.slug] || [];
      const avg = rs.length ? Math.round((rs.reduce((a,b)=>a+b,0)/rs.length)*10)/10 : 0;
      return { ...s, avg_rating: avg, rating_count: rs.length };
    });
  } catch(e) { return []; }
}

async function fetchLeaderboard() {
  try {
    const [recordsRes, mapsRes] = await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/records?select=initials,slug,creator_id`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
      }),
      fetch(`${SUPA_URL}/rest/v1/maps?is_public=eq.true&select=slug`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
      })
    ]);

    if (!recordsRes.ok || !mapsRes.ok) return [];

    const records = await recordsRes.json();
    const publicMaps = await mapsRes.json();

    const publicSlugs = new Set(publicMaps.map(m => m.slug));
    const usePublicFilter = publicSlugs.size > 0;

    // Group by creator_id when available, fall back to initials for old records
    const counts = {};
    records.forEach(r => {
      if (!usePublicFilter || publicSlugs.has(r.slug)) {
        const key = r.creator_id || r.initials;
        if (!counts[key]) counts[key] = { initials: r.initials, count: 0, creator_id: r.creator_id || null };
        counts[key].count++;
        // Use latest initials for this creator_id (handles name changes)
        if (r.initials) counts[key].initials = r.initials;
      }
    });

    return Object.values(counts)
      .sort((a, b) => b.count - a.count)
      .slice(0, 20);
  } catch(e) { console.warn('fetchLeaderboard failed:', e); return []; }
}

async function resetProgress() {
  // Delete from Supabase first
  if (_currentUser) {
    try {
      const token = await getSupabaseToken();
      await fetch(`${SUPA_URL}/rest/v1/user_progress?user_id=eq.${_currentUser.id}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${token}` }
      });
    } catch(e) { console.warn('Reset cloud progress failed:', e); }
  }
  // Wipe progress keys
  ['pb_total_diamonds','pb_spent_diamonds','pb_unlocked','pb_completed_maps','pb_quest_index','pb_shown_tips','pb_controls_shown'].forEach(k => LS.remove(k));
  // Wipe all series progress keys (pb_progress_<seriesName>)
  try {
    // Clear by known series names first
    savedSeries().forEach(s => clearSeriesProgress(s.name));
    HARDCODED_SERIES.forEach(s => clearSeriesProgress(s.name));
    // Also scan all keys as fallback
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('pb_progress_')) keys.push(k);
    }
    keys.forEach(k => localStorage.removeItem(k));
  } catch(e) { console.warn('Series progress clear failed:', e); }
  updateTotalDiamondDisplay();
  showModeSelect();
  showToast('Progress reset. Fresh start! 💎', '#00eeff');
}

function shatterUnlock(btnEl, feature, onComplete) {
  const rect = btnEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  // Feature colors for the burst
  const colors = {
    breakout: ['#7bbfff', '#00aaff', '#ffffff', '#00eeff'],
    blackout: ['#ff8855', '#ff6633', '#ffaa77', '#ffffff'],
    full_builder: ['#f5c842', '#ffdd55', '#ffffff', '#ffa500'],
    choose_map: ['#f5c842', '#e8d5a0', '#ffffff', '#ffcc44'],
  };
  const burstColors = colors[feature] || ['#00eeff', '#ffffff'];

  // Create overlay canvas for particle animation
  const cvs = document.createElement('canvas');
  cvs.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:800;';
  cvs.width = window.innerWidth;
  cvs.height = window.innerHeight;
  document.body.appendChild(cvs);
  const ctx = cvs.getContext('2d');

  // Flash the button white
  const origStyle = btnEl.style.cssText;
  btnEl.style.transition = 'all 0.1s';
  btnEl.style.background = 'rgba(255,255,255,0.95)';
  btnEl.style.boxShadow = `0 0 40px rgba(255,255,255,0.9)`;

  // Shatter particles - fragments flying out
  const particles = [];
  const fragCount = 96;
  for (let i = 0; i < fragCount; i++) {
    const angle = (i / fragCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
    const speed = 3 + Math.random() * 8;
    const size = 3 + Math.random() * 8;
    particles.push({
      x: cx + (Math.random() - 0.5) * rect.width * 0.8,
      y: cy + (Math.random() - 0.5) * rect.height * 0.8,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size,
      color: burstColors[Math.floor(Math.random() * burstColors.length)],
      alpha: 1,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3,
      gravity: 0.25 + Math.random() * 0.2,
    });
  }

  // Diamond sparkles
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 5 + Math.random() * 10;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      size: 2 + Math.random() * 3,
      color: '#00eeff',
      alpha: 1,
      rotation: 0, rotSpeed: 0,
      gravity: 0.15,
      isDiamond: true,
    });
  }

  let frame = 0;
  const totalFrames = 55;

  function animate() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    frame++;

    // Restore button to unlocked state after flash
    if (frame === 8) {
      btnEl.style.cssText = origStyle;
      showModeSelect(); // rebuild home screen with unlocked button
    }

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.97;
      p.alpha = Math.max(0, 1 - frame / totalFrames);
      p.rotation += p.rotSpeed;

      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);

      if (p.isDiamond) {
        // Diamond shape
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.lineTo(p.size * 0.6, 0);
        ctx.lineTo(0, p.size);
        ctx.lineTo(-p.size * 0.6, 0);
        ctx.closePath();
        ctx.fill();
      } else {
        // Fragment shard
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      }
      ctx.restore();
    });

    if (frame < totalFrames) {
      requestAnimationFrame(animate);
    } else {
      cvs.remove();
    }
  }

  requestAnimationFrame(animate);
}

      <div style="color:rgba(200,150,60,0.5);font-size:11px;font-family:'Lato',sans-serif;text-align:center;padding:20px;">Loading users...</div>
    </div>
  `;
  document.body.appendChild(ov);
  ov.querySelector('#umCloseBtn').addEventListener('click', () => ov.remove());

  (async () => {
    const list = ov.querySelector('#umList');
    try {
      const token = await getSupabaseToken();
      const res = await fetch(
        `${SUPA_URL}/rest/v1/user_progress?select=user_id,total_diamonds,spent_diamonds&order=total_diamonds.desc&limit=100`,
        { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${token}` } }
      );
      if (!res.ok) throw new Error(await res.text());
      const users = await res.json();

      // Fetch profiles
      let profileMap = {};
      if (users.length) {
        const ids = users.map(u => `"${u.user_id}"`).join(',');
        const pRes = await fetch(
          `${SUPA_URL}/rest/v1/profiles?select=id,display_name,email&id=in.(${ids})`,
          { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${token}` } }
        );
        if (pRes.ok) {
          const profiles = await pRes.json();
          profiles.forEach(p => profileMap[p.id] = p.display_name || p.email || p.id.slice(0,8));
        }
      }

      list.innerHTML = '';
      if (!users.length) {
        list.innerHTML = '<div style="color:rgba(200,150,60,0.4);font-size:11px;font-family:\'Lato\',sans-serif;text-align:center;padding:20px;">No users found</div>';
        return;
      }

      users.forEach(u => {
        const available = (u.total_diamonds||0) - (u.spent_diamonds||0);
        const name = profileMap[u.user_id] || u.user_id.slice(0,8) + '...';
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(20,14,4,0.8);border:1px solid rgba(120,90,30,0.3);border-radius:3px;';
        row.innerHTML = `
          <div style="flex:1;min-width:0;">
            <div style="font-family:'Cinzel',serif;font-size:11px;color:#c8963c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name}</div>
            <div style="font-size:10px;color:rgba(200,150,60,0.5);margin-top:2px;" id="umStat_${u.user_id}">💎 ${available} available · ${u.total_diamonds||0} total</div>
          </div>
          <input type="number" value="${available}" min="0" style="width:58px;background:rgba(40,28,8,0.9);border:1px solid rgba(200,150,60,0.4);color:#f5c842;font-family:'Lato',sans-serif;font-size:12px;padding:5px 6px;border-radius:2px;text-align:center;" data-uid="${u.user_id}" data-spent="${u.spent_diamonds||0}">
          <button style="background:rgba(60,40,10,0.9);border:1px solid rgba(200,150,60,0.5);color:#c8963c;font-family:'Cinzel',serif;font-size:9px;padding:6px 8px;cursor:pointer;border-radius:2px;letter-spacing:1px;">SET</button>
        `;
        list.appendChild(row);

        row.querySelector('button').addEventListener('click', async (e) => {
          const btn = e.currentTarget;
          const input = row.querySelector('input');
          const newAvailable = parseInt(input.value) || 0;
          const spent = parseInt(input.dataset.spent) || 0;
          const newTotal = newAvailable + spent;
          const uid = input.dataset.uid;
          btn.textContent = '⏳'; btn.disabled = true;
          try {
            const t = await getSupabaseToken();
            const r = await fetch(`${SUPA_URL}/rest/v1/user_progress?user_id=eq.${uid}`, {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPA_KEY,
                'Authorization': `Bearer ${t}`,
                'Prefer': 'return=minimal'
              },
              body: JSON.stringify({ total_diamonds: newTotal })
            });
            if (!r.ok) throw new Error(await r.text());
            btn.textContent = '✓';
            document.getElementById(`umStat_${uid}`).textContent = `💎 ${newAvailable} available · ${newTotal} total`;
            setTimeout(() => { btn.textContent = 'SET'; btn.disabled = false; }, 1500);
          } catch(err) {
            btn.textContent = '✗'; btn.disabled = false;
            showToast('Failed: ' + err.message, '#e63946');
          }
        });
      });
    } catch(e) {
      list.innerHTML = `<div style="color:#e63946;font-size:11px;font-family:'Lato',sans-serif;padding:16px;">${e.message}</div>`;
    }
  })();
}

async function submitRating(slug, type, rating) {
  try {
    // Upsert - one rating per creator per slug+type
    const existing = await fetch(
      `${SUPA_URL}/rest/v1/ratings?slug=eq.${encodeURIComponent(slug)}&type=eq.${encodeURIComponent(type)}&creator_id=eq.${encodeURIComponent(CREATOR_ID)}&select=rating`,
      { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
    );
    const rows = existing.ok ? await existing.json() : [];
    if (rows.length) {
      await fetch(`${SUPA_URL}/rest/v1/ratings?slug=eq.${encodeURIComponent(slug)}&type=eq.${encodeURIComponent(type)}&creator_id=eq.${encodeURIComponent(CREATOR_ID)}`, {
        method: 'PATCH',
        headers: { 'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal' },
        body: JSON.stringify({ rating })
      });
    } else {
      await fetch(`${SUPA_URL}/rest/v1/ratings`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal' },
        body: JSON.stringify({ slug, type, rating, creator_id: CREATOR_ID })
      });
    }
  } catch(e) { console.warn('Rating failed:', e); }
}

async function fetchMyRating(slug, type) {
  try {
    const res = await fetch(
      `${SUPA_URL}/rest/v1/ratings?slug=eq.${encodeURIComponent(slug)}&type=eq.${encodeURIComponent(type)}&creator_id=eq.${encodeURIComponent(CREATOR_ID)}&select=rating`,
      { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
    );
    if (!res.ok) return null;
    const rows = await res.json();
    return rows.length ? rows[0].rating : null;
  } catch(e) { return null; }
}

function showStarRating(slug, type, onDone) {
  // Guard already handled by caller - proceed

  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:700;display:flex;align-items:center;justify-content:center;';

  const panel = document.createElement('div');
  panel.style.cssText = "background:linear-gradient(160deg,#1a1206,#0f0a04);border:1px solid rgba(200,160,60,0.5);border-radius:4px;padding:22px 20px;width:min(280px,88vw);display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 8px 40px rgba(0,0,0,0.8);font-family:'Lato',sans-serif;";

  const label = type === 'series' ? 'Rate this series' : 'Rate this map';
  panel.innerHTML = `
    <div style="font-family:'Cinzel',serif;font-size:12px;color:rgba(200,160,60,0.7);letter-spacing:1px;text-align:center;">${label.toUpperCase()}</div>
    <div id="starRow" style="display:flex;gap:6px;font-size:36px;cursor:pointer;line-height:1;"></div>
    <div id="starLabel" style="font-size:12px;color:rgba(180,140,60,0.5);font-family:'Cinzel',serif;letter-spacing:0.5px;min-height:16px;"></div>
    <button id="starSkip" style="background:none;border:none;color:rgba(160,120,50,0.35);font-family:'Cinzel',serif;font-size:11px;cursor:pointer;letter-spacing:1px;padding:4px;">SKIP</button>
  `;

  ov.appendChild(panel);
  document.body.appendChild(ov);

  const starLabels = ['', 'Meh', 'Okay', 'Good', 'Great', 'Amazing'];
  const starRow = panel.querySelector('#starRow');
  const starLabel = panel.querySelector('#starLabel');
  let selected = 0;
  let submitted = false;

  function renderStars(hover) {
    const n = hover || selected;
    starRow.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const s = document.createElement('span');
      s.textContent = i <= n ? '★' : '☆';
      s.style.color = i <= n ? '#f5c842' : 'rgba(180,140,60,0.3)';
      s.style.transition = 'color 0.1s';
      s.dataset.star = i;
      starRow.appendChild(s);
    }
    starLabel.textContent = n ? starLabels[n] : '';
  }

  renderStars(0);

  // Check if already rated
  fetchMyRating(slug, type).then(existing => {
    if (existing) {
      selected = existing;
      renderStars(0);
      starLabel.textContent = 'Your rating: ' + starLabels[existing];
      starLabel.style.color = 'rgba(245,200,66,0.6)';
    }
  });

  starRow.addEventListener('mousemove', e => {
    const star = e.target.closest('[data-star]');
    if (star) renderStars(parseInt(star.dataset.star));
  });
  starRow.addEventListener('mouseleave', () => renderStars(0));

  starRow.addEventListener('click', e => {
    const star = e.target.closest('[data-star]');
    if (!star || submitted) return;
    selected = parseInt(star.dataset.star);
    submitted = true;
    renderStars(0);
    starLabel.textContent = starLabels[selected] + ' — saved!';
    starLabel.style.color = '#f5c842';
    submitRating(slug, type, selected).then(() => {
      setTimeout(() => { ov.remove(); if(onDone) onDone(); }, 700);
    });
  });

  panel.querySelector('#starSkip').addEventListener('click', () => {
    ov.remove(); if(onDone) onDone();
  });

  ov.addEventListener('click', e => { if(e.target===ov){ ov.remove(); if(onDone) onDone(); } });
}

// Active challenge context - set when a challenge link is opened
let activeChallengeCtx = null; // { chainId, round, challengeId, senderCreatorId }

function getChallengeUrl(chainId, round) {
  return `${GAME_URL}?challenge=${chainId}&round=${round}`;
}

async function createChallenge(mapSlug, recipientId) {
  const chainId = crypto.randomUUID();
  const res = await fetch(`${SUPA_URL}/rest/v1/challenges`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=representation' },
    body: JSON.stringify({ chain_id: chainId, round: 1, map_slug: mapSlug, sender_id: CREATOR_ID, recipient_id: recipientId || null, beaten: false })
  });
  if (!res.ok) throw new Error(await res.text());
  const rows = await res.json();
  return { chainId, challengeId: rows[0].id, round: 1 };
}

async function createNextRound(chainId, round, mapSlug, senderId, recipientId) {
  // For Round 2+, always use the established chain players
  if (round >= 2) {
    const players = await getChainPlayers(chainId);
    if (players && players.playerB) {
      // Swap sender/recipient each round
      recipientId = players.playerA === senderId ? players.playerB : players.playerA;
    }
  }
  const res = await fetch(`${SUPA_URL}/rest/v1/challenges`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=representation' },
    body: JSON.stringify({ chain_id: chainId, round, map_slug: mapSlug, sender_id: senderId, recipient_id: recipientId || null, beaten: false })
  });
  if (!res.ok) throw new Error(await res.text());
  const rows = await res.json();
  return rows[0].id;
}

async function markChallengeBeaten(challengeId) {
  await fetch(`${SUPA_URL}/rest/v1/challenges?id=eq.${challengeId}`, {
    method: 'PATCH',
    headers: { 'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal' },
    body: JSON.stringify({ beaten: true })
  });
}

async function fetchMyChallenges() {
  try {
    // Get all challenge rounds where I'm sender or recipient
    const res = await fetch(
      `${SUPA_URL}/rest/v1/challenges?or=(sender_id.eq.${encodeURIComponent(CREATOR_ID)},recipient_id.eq.${encodeURIComponent(CREATOR_ID)})&order=created_at.desc&select=*`,
      { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
    );
    if (!res.ok) return [];
    return await res.json();
  } catch(e) { return []; }
}

async function loadChallengeRound(chainId, round) {
  const res = await fetch(
    `${SUPA_URL}/rest/v1/challenges?chain_id=eq.${chainId}&round=eq.${round}&select=*&limit=1`,
    { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
  );
  if (!res.ok) return null;
  const rows = await res.json();
  return rows[0] || null;
}

// On page load: check ?challenge= param
// Get the two established players for a chain (from Round 1)
async function getChainPlayers(chainId) {
  try {
    const res = await fetch(
      `${SUPA_URL}/rest/v1/challenges?chain_id=eq.${chainId}&round=eq.1&select=sender_id,recipient_id&limit=1`,
      { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
    );
    if (!res.ok) return null;
    const rows = await res.json();
    if (!rows.length) return null;
    return { playerA: rows[0].sender_id, playerB: rows[0].recipient_id };
  } catch(e) { return null; }
}

(async function checkChallengeParam() {
  const params = new URLSearchParams(window.location.search);
  const chainId = params.get('challenge');
  const round = parseInt(params.get('round') || '1', 10);
  if (!chainId) return;

  try {
    const challengeRow = await loadChallengeRound(chainId, round);
    if (!challengeRow) { setTimeout(() => showToast('⚠️ Challenge not found'), 800); return; }

    // Check if this round is already claimed by someone else
    if (challengeRow.recipient_id && challengeRow.recipient_id !== CREATOR_ID) {
      setTimeout(() => {
        function tryShow() {
          if (typeof showMessage !== 'function') { setTimeout(tryShow, 200); return; }
          const ov = document.createElement('div');
          ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;';
          const panel = document.createElement('div');
          panel.style.cssText = "background:linear-gradient(160deg,#1a0a0a,#120808);border:1px solid rgba(220,60,60,0.4);border-radius:4px;padding:28px 22px;width:min(300px,88vw);display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 8px 40px rgba(0,0,0,0.8);font-family:'Lato',sans-serif;text-align:center;";
          panel.innerHTML = `
            <div style="font-size:32px;">🔒</div>
            <div style="font-family:'Cinzel',serif;font-size:14px;color:#e63946;letter-spacing:1px;">CHALLENGE CLAIMED</div>
            <div style="color:rgba(200,150,150,0.7);font-size:12px;line-height:1.8;">This challenge has already been accepted by another player.</div>
            <button id="claimedHomeBtn" style="width:100%;background:none;border:1px solid rgba(220,60,60,0.4);color:rgba(220,80,80,0.8);font-family:'Cinzel',serif;font-size:12px;padding:12px;cursor:pointer;border-radius:3px;">GO HOME</button>
          `;
          ov.appendChild(panel);
          document.body.appendChild(ov);
          panel.querySelector('#claimedHomeBtn').addEventListener('click', () => { ov.remove(); });
        }
        tryShow();
      }, 800);
      return;
    }

    const levelData = await loadMapBySlug(challengeRow.map_slug);
    if (!levelData) { setTimeout(() => showToast('⚠️ Challenge map not found'), 800); return; }
    levelData.slug = challengeRow.map_slug;

    // Claim this challenge round - set recipient_id if not already set
    if (!challengeRow.recipient_id && challengeRow.sender_id !== CREATOR_ID) {
      fetch(`${SUPA_URL}/rest/v1/challenges?id=eq.${challengeRow.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Prefer':'return=minimal' },
        body: JSON.stringify({ recipient_id: CREATOR_ID })
      }).catch(() => {});
    }

    // Store challenge context for win screen
    activeChallengeCtx = {
      chainId,
      round,
      challengeId: challengeRow.id,
      senderCreatorId: challengeRow.sender_id,
    };

    // Save map locally as a challenge map
    if (levelData.name) {
      const levels = savedLevels();
      const existing = levels.find(l => l.name === levelData.name);
      if (!existing) {
        levels.push({ ...levelData, _challenge: true, _chainId: chainId, received: true });
        LS.set('cc_levels', JSON.stringify(levels));
      }
    }

    // Save challenge thread locally
    saveLocalChallenge(chainId, round, challengeRow, levelData);

    function tryLoad() {
      if (typeof startGame !== 'function') { setTimeout(tryLoad, 200); return; }
      showChallengeIntro(levelData, challengeRow, () => startGame(levelData));
    }
    setTimeout(tryLoad, 600);
  } catch(e) {
    console.error('checkChallengeParam error:', e);
    setTimeout(() => showToast('⚠️ Could not load challenge: ' + (e && e.message ? e.message.slice(0, 60) : String(e))), 800);
  }
})();

function saveLocalChallenge(chainId, round, row, levelData) {
  try {
    const all = JSON.parse(LS.get('pb_challenges') || '[]');
    const existing = all.find(c => c.chainId === chainId && c.round === round);
    if (!existing) {
      all.unshift({ chainId, round, challengeId: row.id, mapSlug: row.map_slug, mapName: levelData.name, senderId: row.sender_id, beaten: false, ts: Date.now() });
      LS.set('pb_challenges', JSON.stringify(all.slice(0, 50)));
    }
  } catch(e) {}
}

function getLocalChallenges() {
  try { return JSON.parse(LS.get('pb_challenges') || '[]'); } catch(e) { return []; }
}

async function showChallengesScreen() {
  const challenges = getLocalChallenges();
  // Clear profile cache so we get fresh names
  Object.keys(_profileCache).forEach(k => { if (_profileCache[k] === null) delete _profileCache[k]; });
  const rows = challenges.map(c => {
    const iMSent = c.senderId === CREATOR_ID;
    const isMyTurn = !iMSent && !c.beaten;          // received, not beaten yet
    const fireBack = !iMSent && c.beaten;            // received AND you beat it
    const isWaiting = iMSent && !c.beaten;           // you sent it, waiting for them
    const theyBeatIt = iMSent && c.beaten;           // you sent it, they beat it - their turn
    const awaitingFireBack = false;
    let statusText, statusColor, clickable;
    if (isMyTurn)           { statusText = '🔴 YOUR TURN';        statusColor = '#e63946'; clickable = true; }
    else if (fireBack)      { statusText = '🔥 FIRE BACK';        statusColor = '#e63946'; clickable = true; }
    else if (isWaiting)     { statusText = '⏳ WAITING';          statusColor = 'rgba(200,160,60,0.7)'; clickable = false; }
    else if (theyBeatIt)    { statusText = '⏳ THEIR TURN';       statusColor = 'rgba(200,160,60,0.7)'; clickable = false; }
    const opponentId = iMSent ? c.recipientId : c.senderId;
    return { c, statusText, statusColor, clickable, isMyTurn, fireBack, isWaiting, theyBeatIt, opponentId };
  }).filter(r => r !== null);

  // Fetch opponent profiles
  const opponentIds = [...new Set(rows.map(r => r.opponentId).filter(Boolean))];

            loadLevelIntoBuilder(levelData);
            const saveBtn = document.getElementById('builderSaveBtn');
            if (saveBtn) { saveBtn.textContent = '🔥 FIRE BACK'; saveBtn.style.background = 'linear-gradient(180deg,rgba(80,10,10,0.98),rgba(50,5,5,0.99))'; saveBtn.style.borderColor = 'rgba(220,60,60,0.7)'; saveBtn.style.color = '#e63946'; }
            const mapsBtn = document.getElementById('builderMapsBtn');
            if (mapsBtn) mapsBtn.style.display = 'none';
    const clearBtn2 = document.getElementById('builderClearBtn');
    if (clearBtn2) clearBtn2.style.display = 'none';
          });
        }
      } catch(e) { showToast('⚠️ Could not load challenge'); showModeSelect(); }
    });
  });

  document.getElementById('challengesBackBtn').addEventListener('click', () => {
    window._challengeScreenRefreshing = false;
    hideMessage(); showModeSelect();
  });
}

// Auto-grow a private local series from a challenge chain
// Called any time a challenge round map is available locally
async function upsertChallengeSeriesLocally(chainId, baseName, newMapSlug, newMapName) {
  try {
    // Fetch all rounds for this chain, ordered by round then created_at
    const res = await fetch(
      `${SUPA_URL}/rest/v1/challenges?chain_id=eq.${chainId}&order=round.asc,created_at.desc&select=round,map_slug,created_at`,
      { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
    );
    if (!res.ok) return;
    const rows = await res.json();

    // Deduplicate: one entry per round number, keep the first (latest created_at due to desc order)
    const seenRounds = new Set();
    const uniqueRounds = [];
    for (const r of rows) {
      if (!seenRounds.has(r.round)) {
        seenRounds.add(r.round);
        uniqueRounds.push(r);
      }
    }
    // Re-sort ascending by round
    uniqueRounds.sort((a, b) => a.round - b.round);

    // Fetch map data for each unique round
    const levels = [];
    for (const r of uniqueRounds) {
      const mapName = r.round === 1 ? baseName : `${baseName} ${r.round}.0`;
      // Try local first by slug or name
      const local = savedLevels().find(l => l.slug === r.map_slug || l.name === mapName);
      if (local) {
        levels.push({ ...local, name: mapName, _challenge: true });
      } else {
        try {
          const data = await loadMapBySlug(r.map_slug);
          if (data) {
            data.name = mapName;
            data.slug = r.map_slug;
            data._challenge = true;
            levels.push(data);
          }
        } catch(e) {}
      }
    }

    if (!levels.length) return;

    const existing = savedSeries().find(s => s._challengeChainId === chainId);
    const seriesObj = {
      name: existing ? existing.name : baseName,
      description: `Challenge chain · ${levels.length} round${levels.length !== 1 ? 's' : ''}`,
      levels,
      is_public: false,
      _challengeChainId: chainId,
      _isChallengeSeries: true,
    };
    saveSeries(seriesObj);
  } catch(e) { console.warn('upsertChallengeSeriesLocally failed:', e); }
}

function migrateAnonymousChallenges(newUserId) {
  // When an anonymous player signs in, their local challenges were stored
  // with senderId = someone else's UUID (they were the recipient).
  // We don't need to change senderId - that's correct.
  // But we do need to make sure syncChallenges runs fresh so Supabase
  // data (which knows their beaten status) overwrites any stale local data.
  // Also stamp recipient_id on any beaten rounds they completed anonymously.
  try {
    const challenges = getLocalChallenges();
    if (!challenges.length) return;

    // For each challenge where they beat it as anonymous, try to stamp recipient_id in Supabase
    challenges.forEach(async c => {
      if (c.beaten && c.challengeId && !c.recipientId) {
        try {
          const token = await getSupabaseToken();
          // Only stamp if recipient_id is still null
          const res = await fetch(
            `${SUPA_URL}/rest/v1/challenges?id=eq.${c.challengeId}&recipient_id=is.null&select=id`,
            { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${token}` } }
          );
          if (res.ok) {
            const rows = await res.json();
            if (rows.length) {
              // Stamp their new Google UUID as recipient
              await fetch(`${SUPA_URL}/rest/v1/challenges?id=eq.${c.challengeId}`, {
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': SUPA_KEY,
                  'Authorization': `Bearer ${token}`,
                  'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ recipient_id: newUserId })
              });
            }
          }
        } catch(e) { console.warn('Challenge migration failed for', c.challengeId, e); }
      }
    });

    // Re-sync from Supabase to get fresh state with new UUID
    setTimeout(() => syncChallenges(), 1500);
  } catch(e) { console.warn('migrateAnonymousChallenges error:', e); }
}

async function syncChallenges() {
  try {
    const rows = await fetchMyChallenges();
    if (!rows.length) return;

    // Group by chain_id, keep only the latest round per chain
    const chainMap = {};
    rows.forEach(r => {
      if (!chainMap[r.chain_id] || r.round > chainMap[r.chain_id].round) {
        chainMap[r.chain_id] = r;
      }
    });

    const synced = Object.values(chainMap).map(r => ({
      chainId: r.chain_id,
      round: r.round,
      challengeId: r.id,
      mapSlug: r.map_slug,
      mapName: null,
      senderId: r.sender_id,
      recipientId: r.recipient_id || null,
      beaten: r.beaten,
      ts: new Date(r.created_at).getTime()
    }));

    // Try to enrich with map names from local storage first
    const localLevels = savedLevels();
    synced.forEach(c => {
      const match = localLevels.find(l => l.slug === c.mapSlug || l.name === c.mapSlug);
      if (match) c.mapName = match.name;
    });

    // For any still missing, fetch from Supabase maps table
    const missing = synced.filter(c => !c.mapName);
    if (missing.length) {
      const slugList = missing.map(c => `"${c.mapSlug}"`).join(',');
      const res = await fetch(
        `${SUPA_URL}/rest/v1/maps?slug=in.(${slugList})&select=slug,name`,
        { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
      );
      if (res.ok) {
        const mapRows = await res.json();
        const slugToName = {};
        mapRows.forEach(m => { slugToName[m.slug] = m.name; });
        synced.forEach(c => {
          if (!c.mapName && slugToName[c.mapSlug]) c.mapName = slugToName[c.mapSlug];
        });
      }
    }

    // Final fallback - clean up the slug into something readable
    synced.forEach(c => {
      if (!c.mapName) {
        // Strip trailing random suffix (e.g. "my-map-7o7gb" → "My Map")
        c.mapName = c.mapSlug
          .replace(/-[a-z0-9]{4,6}$/, '')
          .replace(/-/g, ' ')
          .replace(/\b\w/g, l => l.toUpperCase());
      }
    });

    LS.set('pb_challenges', JSON.stringify(synced.slice(0, 50)));

    // Update auto-growing series for each unique chain
    const chains = {};
    synced.forEach(c => {
      if (!chains[c.chainId]) chains[c.chainId] = c;
    });
    // Note: series are rebuilt when challenges are created/fired back, not on every sync
  } catch(e) { console.warn('syncChallenges failed:', e); }
}
