let alarmGuards = []; // {col, row, prevCol, prevRow, x, y, dir, moveTimer, moveInterval, trail}

function spawnAlarmGuard() {
  const ballC = Math.floor(ball.x / BRICK_W);
  const ballR = Math.floor(ball.y / BRICK_H);
  const minDist = 14;

  // Flood-fill from ball position to find all reachable cells
  const isSolid = (c, r) => bricks.some(b => (b.col ?? Math.round(b.x/BRICK_W)) === c && (b.row ?? Math.round(b.y/BRICK_H)) === r);
  const reachable = new Set();
  const queue = [[ballC, ballR]];
  reachable.add(`${ballC},${ballR}`);
  while (queue.length) {
    const [c, r] = queue.shift();
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nc = c+dc, nr = r+dr;
      if (nc<0||nc>=BRICK_COLS||nr<0||nr>=BRICK_ROWS) continue;
      if (reachable.has(`${nc},${nr}`) || isSolid(nc, nr)) continue;
      reachable.add(`${nc},${nr}`);
      queue.push([nc, nr]);
    }
  }

  // Pick from reachable cells that are far enough from ball
  const openCells = [];
  for (const key of reachable) {
    const [c, r] = key.split(',').map(Number);
    if (Math.abs(c - ballC) + Math.abs(r - ballR) >= minDist) openCells.push({c, r});
  }

  // Fallback: any reachable cell if none far enough
  const candidates = openCells.length ? openCells : [...reachable].map(k => { const [c,r]=k.split(',').map(Number); return {c,r}; });
  if (!candidates.length) return;

  const start = candidates[Math.floor(Math.random() * candidates.length)];
  alarmGuards.push({
    col: start.c, row: start.r,
    prevCol: start.c, prevRow: start.r,
    x: start.c * BRICK_W + BRICK_W/2,
    y: start.r * BRICK_H + BRICK_H/2,
    dir: Math.floor(Math.random() * 4),
    moveTimer: 430, moveInterval: 430,
    trail: []
  });
}

function updateAlarmGuards(dt) {
  if (!alarmGuards.length || !ballLaunched) return;
  const dirs = [{dc:1,dr:0},{dc:0,dr:1},{dc:-1,dr:0},{dc:0,dr:-1}];
  const ballC = Math.floor(ball.x / BRICK_W);
  const ballR = Math.floor(ball.y / BRICK_H);

  alarmGuards.forEach(g => {
    // Smooth position
    const t = Math.min(g.moveTimer / g.moveInterval, 1);
    g.x = (g.prevCol + (g.col - g.prevCol) * t) * BRICK_W + BRICK_W/2;
    g.y = (g.prevRow + (g.row - g.prevRow) * t) * BRICK_H + BRICK_H/2;

    g.moveTimer += dt * 16.67;
    if (g.moveTimer >= g.moveInterval) {
      g.moveTimer = 0;
      g.prevCol = g.col; g.prevRow = g.row;
      g.trail.unshift({x: g.x, y: g.y});
      if (g.trail.length > 5) g.trail.pop();

      const canMove = (dc, dr) => {
        const nc = g.col+dc, nr = g.row+dr;
        if (nc<0||nc>=BRICK_COLS||nr<0||nr>=BRICK_ROWS) return false;
        return !bricks.some(b => (b.col??Math.round(b.x/BRICK_W))===nc && (b.row??Math.round(b.y/BRICK_H))===nr);
      };

      // Home toward ball 85% of the time
      const valid = [0,1,2,3].filter(d => canMove(dirs[d].dc, dirs[d].dr));
      if (valid.length) {
        const scored = valid.map(d => ({
          d, dist: Math.abs((g.col+dirs[d].dc)-ballC) + Math.abs((g.row+dirs[d].dr)-ballR)
        })).sort((a,b) => a.dist-b.dist);
        const pick = Math.random() < 0.85 ? scored[0].d : scored[Math.floor(Math.random()*scored.length)].d;
        g.dir = pick;
        g.col += dirs[pick].dc;
        g.row += dirs[pick].dr;
      }
    }

    // Contact detection
    const dx = ball.x - g.x, dy = ball.y - g.y;
    if (Math.sqrt(dx*dx + dy*dy) < BALL_R * 2.5) {
      alarmGuards = [];
      killBall();
    }
  });
}

function drawAlarmGuards(c) {
  const t = performance.now() * 0.002;
  alarmGuards.forEach(g => {
    const x = g.x, y = g.y, R = BALL_R;
    const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
    const [dx, dy] = dirs[g.dir] || [0, -1];
    const perpCX = -dy, perpCY = dx;

    // Trail - red/blue alternating
    g.trail.forEach((tr, i) => {
      c.globalAlpha = (1 - i/g.trail.length) * 0.25;
      c.fillStyle = i % 2 === 0 ? '#ff2244' : '#2244ff';
      c.beginPath(); c.arc(tr.x, tr.y, R*0.5, 0, Math.PI*2); c.fill();
    });
    c.globalAlpha = 1;

    // Red/blue siren flash
    const sirenPhase = Math.sin(t * 8);
    const sirenColor = sirenPhase > 0 ? 'rgba(255,30,60,0.4)' : 'rgba(30,60,255,0.4)';
    const glow = c.createRadialGradient(x,y,0,x,y,R*2.5);
    glow.addColorStop(0, sirenColor);
    glow.addColorStop(0.6, 'rgba(0,0,0,0.05)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = glow; c.beginPath(); c.arc(x,y,R*2.5,0,Math.PI*2); c.fill();

    // Body - dark navy uniform
    const body = c.createRadialGradient(x-R*0.2,y-R*0.2,0,x,y,R);
    body.addColorStop(0,'#2a3a5c'); body.addColorStop(0.6,'#1a2844'); body.addColorStop(1,'#0c1628');
    c.fillStyle = body; c.beginPath(); c.arc(x,y,R,0,Math.PI*2); c.fill();

    // Cap/visor - flat brim in movement direction
    const capX = x + dx * R * 0.5;
    const capY = y + dy * R * 0.5;
    c.fillStyle = '#0c1628';
    c.beginPath();
    c.moveTo(capX + perpCX*R*0.7, capY + perpCY*R*0.7);
    c.lineTo(capX - perpCX*R*0.7, capY - perpCY*R*0.7);
    c.lineTo(capX + dx*R*0.6 - perpCX*R*0.5, capY + dy*R*0.6 - perpCY*R*0.5);
    c.lineTo(capX + dx*R*0.6 + perpCX*R*0.5, capY + dy*R*0.6 + perpCY*R*0.5);
    c.closePath(); c.fill();

    // Badge - small gold dot
    c.fillStyle = '#daa520';
    c.beginPath();
    c.arc(x - dx*R*0.15 + perpCX*R*0.2, y - dy*R*0.15 + perpCY*R*0.2, R*0.14, 0, Math.PI*2);
    c.fill();

    // Eyes - stern, looking in movement direction
    const eyeFwd = R * 0.2;
    const eyeSpread = R * 0.28;
    [[-perpCX*eyeSpread, -perpCY*eyeSpread], [perpCX*eyeSpread, perpCY*eyeSpread]].forEach(([ex,ey]) => {
      c.fillStyle='#c0c8d8';
      c.beginPath(); c.arc(x+dx*eyeFwd+ex, y+dy*eyeFwd+ey, R*0.16, 0, Math.PI*2); c.fill();
      c.fillStyle='#111';
      c.beginPath(); c.arc(x+dx*eyeFwd+ex+dx*1.2, y+dy*eyeFwd+ey+dy*1.2, R*0.08, 0, Math.PI*2); c.fill();
    });
  });
}

function drawExitArrow(c) {
  // Find the exit gap - a perimeter cell with no brick
  const t = performance.now() * 0.003;
  const pulse = 0.5 + 0.5 * Math.sin(t * 2.5);

  // Check all perimeter cells for gaps
  const perimeterCells = [];
  for (let col = 0; col < BRICK_COLS; col++) {
    perimeterCells.push({ col, row: 0, dx: 0, dy: -1 });
    perimeterCells.push({ col, row: BRICK_ROWS-1, dx: 0, dy: 1 });
  }
  for (let row = 1; row < BRICK_ROWS-1; row++) {
    perimeterCells.push({ col: 0, row, dx: -1, dy: 0 });
    perimeterCells.push({ col: BRICK_COLS-1, row, dx: 1, dy: 0 });
  }

  perimeterCells.forEach(({ col, row, dx, dy }) => {
    const blocked = bricks.some(b => {
      const bc = b.col !== undefined ? b.col : Math.round(b.x / BRICK_W);
      const br = b.row !== undefined ? b.row : Math.round(b.y / BRICK_H);
      return bc === col && br === row;
    });
    if (blocked) return;

    // Draw arrow at this gap pointing outward
    const cx = col * BRICK_W + BRICK_W / 2;
    const cy = row * BRICK_H + BRICK_H / 2;
    const angle = Math.atan2(dy, dx);
    const arrowSize = Math.min(BRICK_W, BRICK_H) * 0.35;
    // Nudge arrow toward exit direction
    const ax = cx + dx * arrowSize * 0.3;
    const ay = cy + dy * arrowSize * 0.3;

    c.save();
    c.globalAlpha = 0.4 + 0.5 * pulse;
    c.translate(ax, ay);
    c.rotate(angle);

    // Glow
    c.shadowColor = '#ffd700';
    c.shadowBlur = 10 + 8 * pulse;

    // Arrow shape
    c.fillStyle = '#ffd700';
    c.beginPath();
    c.moveTo(arrowSize, 0);
    c.lineTo(-arrowSize * 0.5, -arrowSize * 0.6);
    c.lineTo(-arrowSize * 0.2, 0);
    c.lineTo(-arrowSize * 0.5, arrowSize * 0.6);
    c.closePath();
    c.fill();

    c.restore();
  });
}

function drawGuard(c, g) {
  if (!g) return;
  const x = g.x, y = g.y, R = BALL_R;
  const t = performance.now() * 0.002;
  const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
  const [dx, dy] = dirs[g.dir] || [0, -1];
  const perpCX = -dy, perpCY = dx;

  // Trail - red/blue alternating
  g.trail.forEach((tr, i) => {
    c.globalAlpha = (1 - i / g.trail.length) * 0.25;
    c.fillStyle = i % 2 === 0 ? '#ff2244' : '#2244ff';
    c.beginPath(); c.arc(tr.x, tr.y, R * 0.5, 0, Math.PI * 2); c.fill();
  });
  c.globalAlpha = 1;

  // Flashlight - only in Prism Guard mode
  if (gameMode === 'blackout') {
    const fAngle = Math.atan2(dy, dx);
    const coneAngle = Math.PI / 4;
    const maxConeLen = BRICK_W * 3;

    function castRay(rayAngle) {
      const rdx = Math.cos(rayAngle), rdy = Math.sin(rayAngle);
      let dist = 0;
      const step = Math.min(BRICK_W, BRICK_H) * 0.5;
      while (dist < maxConeLen) {
        dist += step;
        const col = Math.floor((x + rdx * dist) / BRICK_W);
        const row = Math.floor((y + rdy * dist) / BRICK_H);
        if (col < 0 || col >= BRICK_COLS || row < 0 || row >= BRICK_ROWS) break;
        if (bricks.some(b => (b.col ?? Math.round(b.x/BRICK_W)) === col && (b.row ?? Math.round(b.y/BRICK_H)) === row)) return dist - step;
      }
      return dist;
    }

    // Draw cone
    const rayCount = 12;
    c.save();
    c.globalAlpha = 0.2;
    c.fillStyle = '#ffffcc';
    c.beginPath();
    c.moveTo(x, y);
    for (let i = 0; i <= rayCount; i++) {
      const ra = fAngle - coneAngle/2 + (coneAngle / rayCount) * i;
      const rl = castRay(ra);
      c.lineTo(x + Math.cos(ra) * rl, y + Math.sin(ra) * rl);
    }
    c.closePath(); c.fill();
    c.globalAlpha = 1; c.restore();

    // Detect player in cone
    if (ballLaunched && ball) {
      const pdx = ball.x - x, pdy = ball.y - y;
      const pdist = Math.sqrt(pdx*pdx + pdy*pdy);
      if (pdist < maxConeLen) {
        const pAngle = Math.atan2(pdy, pdx);
        let diff = Math.abs(pAngle - fAngle);
        if (diff > Math.PI) diff = Math.PI*2 - diff;
        if (diff < coneAngle/2 && pdist <= castRay(pAngle)) {
          guardCaughtPlayer();
        }
      }
    }
  }

  // Siren glow - red/blue flash
  const sirenPhase = Math.sin(t * 8);
  const sirenColor = sirenPhase > 0 ? 'rgba(255,30,60,0.4)' : 'rgba(30,60,255,0.4)';
  const glow = c.createRadialGradient(x, y, 0, x, y, R * 2.5);
  glow.addColorStop(0, sirenColor);
  glow.addColorStop(0.6, 'rgba(0,0,0,0.05)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = glow;
  c.beginPath(); c.arc(x, y, R * 2.5, 0, Math.PI * 2); c.fill();

  // Body - dark navy uniform
  const body = c.createRadialGradient(x - R * 0.2, y - R * 0.2, 0, x, y, R);
  body.addColorStop(0, '#2a3a5c');
  body.addColorStop(0.6, '#1a2844');
  body.addColorStop(1, '#0c1628');
  c.fillStyle = body;
  c.beginPath(); c.arc(x, y, R, 0, Math.PI * 2); c.fill();

  // Cap/visor - flat brim in movement direction
  const capX = x + dx * R * 0.5;
  const capY = y + dy * R * 0.5;
  c.fillStyle = '#0c1628';
  c.beginPath();
  c.moveTo(capX + perpCX*R*0.7, capY + perpCY*R*0.7);
  c.lineTo(capX - perpCX*R*0.7, capY - perpCY*R*0.7);
  c.lineTo(capX + dx*R*0.6 - perpCX*R*0.5, capY + dy*R*0.6 - perpCY*R*0.5);
  c.lineTo(capX + dx*R*0.6 + perpCX*R*0.5, capY + dy*R*0.6 + perpCY*R*0.5);
  c.closePath(); c.fill();

  // Badge - small gold dot
  c.fillStyle = '#daa520';
  c.beginPath();
  c.arc(x - dx*R*0.15 + perpCX*R*0.2, y - dy*R*0.15 + perpCY*R*0.2, R*0.14, 0, Math.PI*2);
  c.fill();

  // Eyes - stern, looking in movement direction
  const eyeFwd = R * 0.2;
  const eyeSpread = R * 0.28;
  [[-perpCX*eyeSpread, -perpCY*eyeSpread], [perpCX*eyeSpread, perpCY*eyeSpread]].forEach(([ex,ey]) => {
    c.fillStyle = '#c0c8d8';
    c.beginPath(); c.arc(x+dx*eyeFwd+ex, y+dy*eyeFwd+ey, R*0.16, 0, Math.PI*2); c.fill();
    c.fillStyle = '#111';
    c.beginPath(); c.arc(x+dx*eyeFwd+ex+dx*1.2, y+dy*eyeFwd+ey+dy*1.2, R*0.08, 0, Math.PI*2); c.fill();
  });
}

function spawnDiamondBurst(x,y){
  // Large sparkly cyan+white explosion
  for(let i=0;i<28;i++){
    const a=Math.random()*Math.PI*2;
    const s=2+Math.random()*5;
    const col=Math.random()<0.5?'#00eeff':'#ffffff';
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color:col,life:1,size:2+Math.random()*5});
  }
  // Extra large slow shards
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2;
    particles.push({x,y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,color:'#00eeff',life:1.2,size:5+Math.random()*6});
  }
}

function spawnParticles(x,y,color,n=14){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1.5+Math.random()*2.5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:1,size:2+Math.random()*3});
  }
}

// =====================================================================
// GAME LOOP
// =====================================================================
let lastTime=null;
let deathFreeze=false; // particles keep running but game logic stops
function loop(ts){
  if(lastTime===null) lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.67,2);
  lastTime=ts;
  if(gameRunning&&!paused) update(dt);
  else if(_guardAlertFrame >= 0) updateGuardAlert(); // tick guard-caught animation even when gameRunning is false
  else if(fallingBricks.length>0) updateFinale(dt); // keep animating during blackout finale
  else if(deathFreeze){
    // Only tick particles so the explosion plays out
    for(let p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.08*dt; p.life-=0.04*dt; }
    particles=particles.filter(p=>p.life>0);
    if(screenFlash>0) screenFlash--;
  }
  if(!builderOpen) draw();
  requestAnimationFrame(loop);
}

function update(dt){
  const STEPS=6, subDt=dt/STEPS;
  for(let step=0;step<STEPS;step++){
    const prevX=ball.x, prevY=ball.y;
    const effLeft  = controlsReversed ? moveRight : moveLeft;
    const effRight = controlsReversed ? moveLeft  : moveRight;
    const hMove=((effLeft?-BALL_MOVE:0)+(effRight?BALL_MOVE:0)+ball.vx)*subDt;
    ball.x+=hMove; ball.vx*=0.92;
    if(ball.x-BALL_R<0){
      if(gameMode==='escape' && checkPerimeterEscape('left', ball.y)) return;
      ball.x=BALL_R; ball.vx=Math.abs(ball.vx)*0.4+0.5;
    }
    if(ball.x+BALL_R>W){
      if(gameMode==='escape' && checkPerimeterEscape('right', ball.y)) return;
      ball.x=W-BALL_R; ball.vx=-(Math.abs(ball.vx)*0.4+0.5);
    }
    ball.y+=ball.vy*subDt;
    if(ball.y-BALL_R<=0){
      if(gameMode==='escape' && checkPerimeterEscape('top', ball.x)) return;
      ball.y=BALL_R;ball.vy=Math.abs(ball.vy);
    }
    if(ball.y+BALL_R>=H){
      if(gameMode==='escape' && checkPerimeterEscape('bottom', ball.x)) return;
      ball.y=H-BALL_R;ball.vy=-Math.abs(ball.vy);
    }
    for(let b of bricks) if(b.cooldown>0) b.cooldown--;
    checkBrickCollisions();
    if(gameOver) return;

    // Diagonal corner safety net - catch ball leaking through corner seams
    // Probe 4 diagonal points on the ball's edge
    const probeR=BALL_R*0.71; // ~cos(45°) offset to probe the diagonal edges
    for(let pi=0;pi<4;pi++){
      const px=ball.x+(pi<2?probeR:-probeR);
      const py=ball.y+(pi%2===0?probeR:-probeR);
      const pc=Math.floor(px/BRICK_W);
      const pr=Math.floor(py/BRICK_H);
      if(pc<0||pc>=BRICK_COLS||pr<0||pr>=BRICK_ROWS) continue;
      // Check against live bricks (not the grid) to avoid false hits on just-destroyed bricks
      const hit=bricks.some(b=>{
        const bc=b.col!==undefined?b.col:Math.round(b.x/BRICK_W);
        const br=b.row!==undefined?b.row:Math.round(b.y/BRICK_H);
        return bc===pc&&br===pr;
      });
      if(!hit) continue;
      // Ball edge is inside an occupied cell - check if normal collision missed it
      // (this only fires for diagonal leak-throughs)
      const prevC=Math.floor(prevX/BRICK_W), prevR=Math.floor(prevY/BRICK_H);
      const curC=Math.floor(ball.x/BRICK_W), curR=Math.floor(ball.y/BRICK_H);
      const crossedCol=curC!==prevC, crossedRow=curR!==prevR;
      if(crossedCol&&crossedRow){
        // True diagonal move - push back on the axis with less penetration
        const bx=pc*BRICK_W, by=pr*BRICK_H;
        const overlapX=Math.min(ball.x+BALL_R-bx, bx+BRICK_W-(ball.x-BALL_R));
        const overlapY=Math.min(ball.y+BALL_R-by, by+BRICK_H-(ball.y-BALL_R));
        if(overlapX<overlapY){
          ball.x=prevX; ball.vx=-ball.vx;
        } else {
          ball.y=prevY; ball.vy=-ball.vy;
        }
        break;
      } else if(crossedCol){
        ball.x=prevX; ball.vx=-ball.vx; break;
      } else if(crossedRow){
        ball.y=prevY; ball.vy=-ball.vy; break;
      }
    }
  }
  ball.trail.push({x:ball.x,y:ball.y});
  const maxTrail = (()=>{ const bc=(ball.color||'#ffffff').toLowerCase(); return STORE_ITEMS.some(i=>i.category==='trails'&&isActive(i.id)&&i.ballColor&&i.ballColor.toLowerCase()===bc) ? 30 : 8; })();
  if(ball.trail.length>maxTrail) ball.trail.shift();

  // Tick active bombs - collect detonations first, then process
  const toDetonate=[];
  activeBombs=activeBombs.filter(bomb=>{
    if(bomb.timer===Infinity) return true; // detonator - sits until triggered
    bomb.timer-=dt*16.67;
    if(bomb.timer<=0){ toDetonate.push(bomb); return false; }
    return true;
  });
  toDetonate.forEach(bomb=>detonateBomb(bomb));

  // Win condition: blackout = clear all colored bricks (check AFTER detonations)
  if(gameMode==='blackout' && !finaleTriggered && !gameOver){
    // Win condition: the perimeter lock has been opened (removed from bricks)
    // The perimeter lock is on row 0, last row, col 0, or last col
    const perimeterLockExists = bricks.some(b => b.isLock && (
      b.row === 0 || b.row === BRICK_ROWS-1 || b.col === 0 || b.col === BRICK_COLS-1
    ));
    if (!perimeterLockExists) {
      triggerBlackoutFinale();
      return;
    }
  }

  // Update guards
  if((gameMode==='blackout' || guards.length > 0) && !isRespawning) guards.filter(Boolean).forEach(g => updateGuard(dt, g));
  if(gameMode==='blackout' || guards.length > 0) updateGuardAlert();
  if(gameMode==='escape' && alarmGuards.length > 0 && !isRespawning) updateAlarmGuards(dt);

  // Bomb regeneration - if any color bricks exist without a matching paint brick, spawn a bomb
  if(gameMode==='blackout' && gameRunning && !testingLevel && Math.random()<0.002*dt){
    const colorBricks=bricks.filter(b=>!b.isPaint&&!b.isSteel&&!b.isKey&&!b.isLock&&!b.isDiamond&&!b.isWhite&&!b.isSkull&&!b.isReverse&&!b.isBomb);
    const paintColors=new Set(bricks.filter(b=>b.isPaint).map(b=>b.color));
    const orphaned=colorBricks.filter(b=>!paintColors.has(b.color));
    if(orphaned.length>0){
      // Find a free cell away from the ball
      const occ=new Set(bricks.map(b=>`${b.col!==undefined?b.col:Math.round(b.x/BRICK_W)},${b.row!==undefined?b.row:Math.round(b.y/BRICK_H)}`));
      for(let a=0;a<40;a++){
        const rc=Math.floor(Math.random()*BRICK_COLS);
        const rr=Math.floor(Math.random()*BRICK_ROWS);
        if(occ.has(`${rc},${rr}`)) continue;
        if(Math.abs(rc-Math.floor(ball.x/BRICK_W))<=2&&Math.abs(rr-Math.floor(ball.y/BRICK_H))<=2) continue;
        bricks.push({x:rc*BRICK_W,y:rr*BRICK_H,w:BRICK_W,h:BRICK_H,col:rc,row:rr,
          color:'#ff6600',isPaint:false,isSteel:false,isKey:false,isLock:false,
          isDiamond:false,isWhite:false,isSkull:false,isReverse:false,isBomb:true,hit:0,cooldown:0});
        spawnParticles(rc*BRICK_W+BRICK_W/2,rr*BRICK_H+BRICK_H/2,'#ff6600',6);
        break;
      }
    }
  }
  // Escape win handled in checkDiamondWin() called from resolveBrick
  for(let p of particles){ p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.08*dt;p.life-=0.04*dt; }
  particles=particles.filter(p=>p.life>0);
}

function updateFinale(dt){
  let allSettled=true;
  for(const fb of fallingBricks){
    fb.vy+=0.4*dt;
    fb.x+=fb.vx*dt;
    fb.y+=fb.vy*dt;
    if(fb.y+fb.h < H+fb.h) allSettled=false; // still in flight or just hit bottom
    if(fb.y+fb.h >= H && !fb.exploded){
      fb.exploded=true;
      spawnParticles(fb.x+fb.w/2, H-2, fb.color, 12);
      for(let i=0;i<5;i++){
        const s=3+Math.random()*5;
        particles.push({x:fb.x+fb.w/2,y:H-2,
          vx:(Math.random()-0.5)*s*1.5,vy:-(s+1+Math.random()*2),
          color:'#ffffff',life:0.9,size:2+Math.random()*4});
      }
    }
  }
  fallingBricks=fallingBricks.filter(fb=>fb.y < H+200 && !isNaN(fb.y));
  for(let p of particles){ p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.12*dt;p.life-=0.035*dt; }
  particles=particles.filter(p=>p.life>0);
  if(fallingBricks.length===0 && !gameOver && !finaleTriggered){
    finaleTriggered=true;
    setTimeout(()=>{ endGame('clear'); }, 600);
  }
  // Safety: if finale runs too long, force end
  if(!finaleTimeout) finaleTimeout = setTimeout(()=>{ if(!gameOver && !gameRunning){ endGame('clear'); } finaleTimeout=null; }, 5000);
}

function checkPerimeterEscape(side, pos) {
  if (_escaping) return true; // already escaping, let ball keep moving
  let col, row;
  if (side === 'left')   { col = 0;             row = Math.floor(pos / BRICK_H); }
  if (side === 'right')  { col = BRICK_COLS - 1; row = Math.floor(pos / BRICK_H); }
  if (side === 'top')    { col = Math.floor(pos / BRICK_W); row = 0; }
  if (side === 'bottom') { col = Math.floor(pos / BRICK_W); row = BRICK_ROWS - 1; }

  const blocked = bricks.some(b => {
    const bc = b.col !== undefined ? b.col : Math.round(b.x / BRICK_W);
    const br = b.row !== undefined ? b.row : Math.round(b.y / BRICK_H);
    return bc === col && br === row;
  });

  if (!blocked) {
    _escaping = true;
    if(ballLaunched && gameStartTime) totalElapsed += (performance.now() - gameStartTime) / 1000;
    gameStartTime = 0;
    screenFlash = 8;
    // Check every 50ms until ball is off screen
    const checkGone = setInterval(() => {
      if (ball.x < -BALL_R*4 || ball.x > W+BALL_R*4 || ball.y < -BALL_R*4 || ball.y > H+BALL_R*4) {
        clearInterval(checkGone);
        _escaping = false;
        endGame('clear');
      }
    }, 50);
    // Safety timeout
    setTimeout(() => { clearInterval(checkGone); if(_escaping){ _escaping=false; endGame('clear'); } }, 1500);
    return true;
  }
  return false;
}

function triggerBlackoutFinale(){
  if(finaleTriggered) return;
  finaleTriggered=true;
  gameRunning=false;
  guards = [];
  activeBombs=[];
  // Celebration burst
  for(let i=0;i<8;i++) spawnDiamondBurst(ball.x, ball.y);
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2, s=4+Math.random()*8;
    particles.push({x:ball.x,y:ball.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      color:Math.random()<0.5?'#ffd700':'#ffffff',life:1.5,size:3+Math.random()*5});
  }
  screenFlash=15;
  setTimeout(()=>{ endGame('clear'); }, 800);
}

// roundRect polyfill for older Safari
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
    else r=Object.assign({tl:0,tr:0,br:0,bl:0},r);
    this.beginPath();
    this.moveTo(x+r.tl,y);
    this.lineTo(x+w-r.tr,y); this.quadraticCurveTo(x+w,y,x+w,y+r.tr);
    this.lineTo(x+w,y+h-r.br); this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
    this.lineTo(x+r.bl,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r.bl);
    this.lineTo(x,y+r.tl); this.quadraticCurveTo(x,y,x+r.tl,y);
    this.closePath();
    return this;
  };
}

function drawTapHint(c, cx, cy, isLeft){
  c.save();
  c.globalAlpha = 0.18;
  c.fillStyle = '#ffffff';
  const size = Math.min(W, H) * 0.18;
  const aw = size, ah = size * 0.7, tailH = ah * 0.38;
  const neck = aw * 0.42;
  const x = cx, y = cy;
  c.beginPath();
  if(isLeft){
    c.moveTo(x - aw/2, y);
    c.lineTo(x - aw/2 + neck, y - ah/2);
    c.lineTo(x - aw/2 + neck, y - tailH/2);
    c.lineTo(x + aw/2, y - tailH/2);
    c.lineTo(x + aw/2, y + tailH/2);
    c.lineTo(x - aw/2 + neck, y + tailH/2);
    c.lineTo(x - aw/2 + neck, y + ah/2);
  } else {
    c.moveTo(x + aw/2, y);
    c.lineTo(x + aw/2 - neck, y - ah/2);
    c.lineTo(x + aw/2 - neck, y - tailH/2);
    c.lineTo(x - aw/2, y - tailH/2);
    c.lineTo(x - aw/2, y + tailH/2);
    c.lineTo(x + aw/2 - neck, y + tailH/2);
    c.lineTo(x + aw/2 - neck, y + ah/2);
  }
  c.closePath();
  c.fill();
  c.restore();
}

function draw(){
  // Draw background
  if (gameMode === 'blackout') {
    // Prism Guard - pure black
    ctx.fillStyle = '#000000'; ctx.fillRect(0,0,W,H);
  } else if(BG_IMAGE.complete && BG_IMAGE.naturalWidth>0){
    const scaleX = W / BG_IMAGE.naturalWidth;
    const scaleY = H / BG_IMAGE.naturalHeight;
    const scale = Math.max(scaleX, scaleY);
    const drawW = BG_IMAGE.naturalWidth * scale;
    const drawH = BG_IMAGE.naturalHeight * scale;
    const drawX = (W - drawW) / 2;
    const drawY = (H - drawH) / 2;
    ctx.drawImage(BG_IMAGE, drawX, drawY, drawW, drawH);
    // Darken slightly so bricks pop
    ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,H);
  } else {
    // BG still loading - use dark gradient so game is still playable
    ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(10,10,30,0.8)'; ctx.fillRect(0,0,W,H);
  }

  for(let b of bricks) drawBrick(ctx,b);
  // Draw placed bombs
  for(const bomb of activeBombs) drawPlacedBomb(ctx, bomb);
  if(gameMode==='blackout' || guards.length > 0) guards.filter(Boolean).forEach(g => drawGuard(ctx, g));
  if(gameMode==='escape' && alarmGuards.length > 0) drawAlarmGuards(ctx);
  if(gameMode==='escape' && !_escaping) drawExitArrow(ctx);
  if(gameMode==='blackout' || guards.length > 0) { drawGuardAlert(); guards = guards.filter(Boolean); }
  // Draw falling bricks during blackout finale
  for(const fb of fallingBricks){
    if(!fb.exploded){
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(fb.x+2,fb.y+2,fb.w,fb.h);
      ctx.fillStyle=fb.color; ctx.fillRect(fb.x,fb.y,fb.w,fb.h);
      ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(fb.x,fb.y,fb.w,2); ctx.fillRect(fb.x,fb.y,2,fb.h);
    }
  }
  if(gameRunning||!gameOver||fallingBricks.length>0) drawBall(ctx,ball);
  if(gameRunning&&!ballLaunched){
    // Left zone hint
    drawTapHint(ctx, W*0.22, H*0.65, true);
    // Right zone hint
    drawTapHint(ctx, W*0.78, H*0.65, false);
    // Launch prompt
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.font='6px "Press Start 2P",monospace';
    ctx.textAlign='center';
    ctx.fillText('TAP TO LAUNCH',W/2,H/2+BALL_R+18);
    ctx.textAlign='left';
  }
  // Live timer once launched
  if(gameRunning&&ballLaunched&&!paused){
    const elapsed=(totalElapsed + (gameStartTime ? (performance.now()-gameStartTime)/1000 : 0)).toFixed(1);
    ctx.font='7px "Press Start 2P",monospace';
    ctx.textAlign='right';
    // Time to Beat - shown above timer if record exists
    if(currentMapRecord){
      const ttb = formatTime(currentMapRecord.time_seconds);
      const elapsedNum = parseFloat(elapsed);
      const beating = elapsedNum < currentMapRecord.time_seconds;
      ctx.fillStyle = beating ? 'rgba(245,200,66,0.8)' : 'rgba(255,80,60,0.8)';
      ctx.fillText(`TTB ${currentMapRecord.initials} ${ttb}`, W-6, 14);
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillText(elapsed+'s', W-6, 24);
    } else {
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillText(elapsed+'s', W-6, 14);
    }
    ctx.textAlign='left';
    // Level indicator when playing a series
    if(activeSeries && !testingLevel){
      const lvLabel = `LEVEL ${activeSeriesIdx+1} OF ${activeSeries.levels.length}`;
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.font='7px "Press Start 2P",monospace';
      ctx.textAlign='right';
      ctx.fillText(lvLabel, W-6, currentMapRecord ? 34 : 24);
      ctx.textAlign='left';
    }
  }
  // Screen flash on diamond collect
  if(screenFlash>0){
    ctx.fillStyle=`rgba(255,255,255,${screenFlash/8*0.7})`;
    ctx.fillRect(0,0,W,H);
    screenFlash--;
  }
  if(gameRunning){
    // Reversed controls indicator
    if(controlsReversed){
      const t=performance.now()*0.004;
      ctx.globalAlpha=0.7+0.3*Math.sin(t);
      ctx.fillStyle='#cccccc';
      ctx.font='6px "Press Start 2P",monospace';
      ctx.textAlign='center';
      ctx.fillText('⇄ REVERSED', W/2, 14);
      ctx.globalAlpha=1;
      ctx.textAlign='left';
    }
  }
  if(paused){
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd700'; ctx.font='12px "Press Start 2P",monospace';
    ctx.textAlign='center'; ctx.fillText('PAUSED',W/2,H/2); ctx.textAlign='left';
  }
  ctx.fillStyle=ball.color; ctx.fillRect(0,H-5,W,5);
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(0,H-5,W,1);
  for(let p of particles){
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.fillRect(~~p.x,~~p.y,~~p.size,~~p.size);
  }
  ctx.globalAlpha=1;
}

  msgBox.innerHTML=`<div style="min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:16px 20px;box-sizing:border-box;">${html}</div>`;
  msgBox.style.display='block';
  msgBox.style.pointerEvents='auto';
}
function hideMessage(){ msgBox.style.display='none'; msgBox.style.pointerEvents='none'; }

function startGame(levelData, forcedMode){
  currentForcedMode = forcedMode || null; // persist for restarts

  // Nuke any floating tip/overlay divs left over from previous game
  document.querySelectorAll('body > div[style*="position:fixed"]').forEach(el => {
    // Don't remove msgBox or the main UI - only tip/overlay panels
    if (el !== msgBox && el.style.zIndex >= 500) el.remove();
  });
  _tipQueue = []; _tipShowing = false;

  selfDestructBtn.style.display='block';
  showTopBarBtns(true);

  // Show controls orientation on very first game ever (not in Prism Guard)
  if (!LS.get('pb_controls_shown') && forcedMode !== 'blackout') {
    LS.set('pb_controls_shown', '1');
    setTimeout(() => showControlsTip(), 800);
  }

  // Show how-to-play for first 2 plays (not in Prism Guard)
  const howtoCount = parseInt(LS.get('pb_howto_count') || '0', 10);
  if (howtoCount < 2 && forcedMode !== 'blackout') {
    LS.set('pb_howto_count', String(howtoCount + 1));
    setTimeout(() => showHowToPlay(), 1000);
  }

  // Show edit button only for custom/saved levels (levelData has a name and bricks)
  const editBtn = document.getElementById('editMapBtn');
  currentLevelData = levelData || null;
  // Show edit only for custom maps - not quest series levels, not random levels
  const isHardcodedLevel = levelData && HARDCODED_SERIES.some(s=>s.levels.some(l=>l.name===levelData.name));
  const isCustomLevel = !!(levelData && levelData.name && levelData.bricks && !isHardcodedLevel && !testingLevel);
  editBtn.style.display = isCustomLevel ? 'block' : 'none';
  particles=[]; gameOver=false; ballLaunched=false; paused=false;
  gameStartTime=0; totalElapsed=0; keysHeld=0; diamondsCollected=0; screenFlash=0;
  lives=3; usedContinue=false; controlsReversed=false; fallingBricks=[]; finaleTriggered=false; finaleTimeout=null; bombsHeld=0; activeBombs=[]; bothSidesHeld=false; bothSidesTimestamp=0; isRespawning=false; guards=[]; alarmGuards=[]; _guardAlertFrame=-1; _escaping=false; blownUpKeys=[]; deathFreeze=false;
  if(bothSidesReleaseTimer){ clearTimeout(bothSidesReleaseTimer); bothSidesReleaseTimer=null; }
  bombHud.style.display='none';
  renderLives();
  keyDisplay.textContent=0;

  if(levelData && levelData.bricks){
    // Use stored col/row if available (screen-independent), else derive from pixel coords
    let ballCol, ballRow;
    if(levelData.ballCol !== undefined){
      ballCol = levelData.ballCol;
      ballRow = levelData.ballRow;
    } else {
      const srcW = levelData.bricks.length ? (levelData.bricks[0].w || BRICK_W) : BRICK_W;
      const srcH = levelData.bricks.length ? (levelData.bricks[0].h || BRICK_H) : BRICK_H;
      ballCol = levelData.ballX!=null ? Math.round(levelData.ballX/srcW) : Math.floor(BRICK_COLS/2);
      ballRow = levelData.ballY!=null ? Math.round(levelData.ballY/srcH) : Math.floor(BRICK_ROWS/2);
    }
    initBall(ballCol*BRICK_W + BRICK_W/2, ballRow*BRICK_H + BRICK_H/2);
    bricks=bricksFromSaved(levelData.bricks);
    // Legacy: convert portal to a diamond brick placed at portal position
    if(levelData.portal){
      const p=levelData.portal;
      bricks.push({x:p.x,y:p.y,w:BRICK_W,h:BRICK_H,
        color:'#00eeff',isPaint:false,isSteel:false,isKey:false,isLock:false,isDiamond:true,hit:0,cooldown:0});
    }
  } else if(levelData && Array.isArray(levelData)){
    initBall(); bricks=bricksFromSaved(levelData);
    if(forcedMode==='escape') bricks=addRandomDiamonds(bricks);
  } else {
    if (forcedMode === 'blackout') {
      // Guard mode - steel perimeter with lock exit
      const guardMap = buildGuardModeMap();
      bricks = guardMap.bricks;
      initBall(guardMap.ballCol * BRICK_W + BRICK_W/2, guardMap.ballRow * BRICK_H + BRICK_H/2);
      // Pure black background handled in draw()
    } else {
      initBall();
      bricks = buildRandomBricks(forcedMode);
      if(forcedMode==='escape') bricks=addRandomDiamonds(bricks);
      addRandomHazards(bricks, forcedMode);
    }
  }

  // Apply level background if set, or pick random for Break Out / Blackout
  if(levelData && levelData.background && BACKGROUNDS[levelData.background]){
    setBgKey(levelData.background);
  } else if(!levelData || !levelData.bricks){
    // Random mode - pick from owned backgrounds (not for blackout - that's always black)
    if (forcedMode !== 'blackout') {
      const allBgKeys = Object.keys(BACKGROUNDS);
      const bgItems = STORE_ITEMS.filter(i => i.category === 'backgrounds');
      const ownedBgKeys = allBgKeys.filter(k => {
        if (k === 'Forest Path') return true;
        const storeItem = bgItems.find(i => i.bg === k);
        return storeItem ? isActive(storeItem.id) : false;
      });
      const bgKeys = ownedBgKeys.length ? ownedBgKeys : allBgKeys;
      setBgKey(bgKeys[Math.floor(Math.random() * bgKeys.length)]);
    }
  } else {
    setBgKey('Forest Path');
  }

  // Mode: escape if any diamonds, blackout otherwise
  gameMode = (forcedMode === 'blackout') ? 'blackout' : (forcedMode === 'escape') ? 'loot' : 'escape';

  // Spawn guard for blackout - never during builder testing
  guards = [];
  _guardAlertFrame = -1;
  _alertX = 0; _alertY = 0;
  _escaping = false;
  finaleTriggered = false;
  isRespawning = false;
  deathFreeze = false;
  if(gameMode==='blackout' && !testingLevel){
    _tipQueue = []; _tipShowing = false; // clear any pending tips
    spawnGuard();
  }

  // Update diamond HUD
  const totalDiamonds=bricks.filter(b=>b.isDiamond).length;
  if(totalDiamonds>0){
    diamondHud.style.display='inline';
    diamondDisplay.textContent='0';
    diamondTotal.textContent=totalDiamonds;
  } else {
    diamondHud.style.display='none';
  }

  currentLevelBricks={ bricks:bricks.map(b=>({...b})), ballX:ball.x, ballY:ball.y, name:(levelData&&levelData.name)||null };
  gameRunning=true; hideMessage();
  // Load Time to Beat for HUD display
  currentMapRecord = null;
  if(levelData && levelData.name){
    (async ()=>{
      try {
        let slug = levelData.slug || null;
        // Fall back to name lookup if no slug stored
        if(!slug){
          const res = await fetch(`${SUPA_URL}/rest/v1/maps?name=eq.${encodeURIComponent(levelData.name)}&select=slug&limit=1`, {
            headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
          });
          if(res.ok){ const rows=await res.json(); if(rows.length){ slug=rows[0].slug; levelData.slug=slug; } }
        }
        if(slug) currentMapRecord = await fetchRecord(slug);
      } catch(e){ console.warn('Record fetch failed:', e); }
    })();
  }
}

function restartGame(){
  particles=[]; gameOver=false; ballLaunched=false; paused=false;
  gameStartTime=0; totalElapsed=0; keysHeld=0; diamondsCollected=0; screenFlash=0;
  bombsHeld=0; activeBombs=[]; bothSidesHeld=false; bombHud.style.display="none";
  blownUpKeys=[]; isRespawning=false; deathFreeze=false; finaleTriggered=false;
  guards=[]; alarmGuards=[]; _guardAlertFrame=-1; _alertX=0; _alertY=0; _escaping=false;
  _tipQueue=[]; _tipShowing=false;
  lives=3; controlsReversed=false;
  renderLives();
  keyDisplay.textContent=0;
  gameMode = (currentForcedMode === 'blackout') ? 'blackout' : (currentForcedMode === 'escape') ? 'loot' : 'escape';
  if(gameMode === 'blackout'){
    const guardMap = buildGuardModeMap();
    bricks = guardMap.bricks;
    initBall(guardMap.ballCol * BRICK_W + BRICK_W/2, guardMap.ballRow * BRICK_H + BRICK_H/2);
    spawnGuard();
  } else {
    if(currentLevelBricks){
      initBall(currentLevelBricks.ballX, currentLevelBricks.ballY);
      bricks=bricksFromSaved(currentLevelBricks.bricks);
    } else {
      initBall(); bricks=buildRandomBricks();
    }
  }
  const totalDiamonds=bricks.filter(b=>b.isDiamond).length;
  if(totalDiamonds>0){
    diamondHud.style.display='inline';
    diamondDisplay.textContent='0';
    diamondTotal.textContent=totalDiamonds;
  } else {
    diamondHud.style.display='none';
  }
  gameRunning=true; hideMessage();
}

function launchBall(){ ball.vy=-BALL_SPD; ballLaunched=true; gameStartTime=performance.now(); }

// =====================================================================
const gameArea = document.getElementById('canvasWrap');

// Track active touches mapped to which side they're on
const activeTouches = {}; // pointerId -> 'left'|'right'

function getSide(clientX){ return clientX < window.innerWidth/2 ? 'left' : 'right'; }

let bothSidesTimestamp=0;
let bothSidesReleaseTimer=null;

function updateMoveFlags(){
  moveLeft  = Object.values(activeTouches).some(s=>s==='left');
  moveRight = Object.values(activeTouches).some(s=>s==='right');

  const bothNow = moveLeft && moveRight;

  if(bothNow && !bothSidesHeld){
    // Both sides just became held together
    bothSidesHeld=true;
    bothSidesTimestamp=performance.now();
    if(bothSidesReleaseTimer){ clearTimeout(bothSidesReleaseTimer); bothSidesReleaseTimer=null; }
  } else if(bothSidesHeld && !bothNow){
    // One thumb lifted - start a short window (150ms)
    // If the other follows within that window, it's an intentional release → drop bomb
    // If no second lift in that window, it was just a slide → cancel
    if(!bothSidesReleaseTimer){
      const heldDuration = performance.now() - bothSidesTimestamp;
      bothSidesReleaseTimer=setTimeout(()=>{
        bothSidesReleaseTimer=null;
        // After window: if neither side is held, and it was intentional (held 80ms+), drop
        const stillLeft  = Object.values(activeTouches).some(s=>s==='left');
        const stillRight = Object.values(activeTouches).some(s=>s==='right');
        if(!stillLeft && !stillRight && heldDuration>=80 && bothSidesHeld){
          const hasDetonator = isActive('skin_dynamite');
          if(bombsHeld>0 && gameRunning && ballLaunched){
            const col=Math.round((ball.x-BRICK_W/2)/BRICK_W);
            const row=Math.round((ball.y-BRICK_H/2)/BRICK_H);
            const safeCol=Math.max(0,Math.min(BRICK_COLS-1,col));
            const safeRow=Math.max(0,Math.min(BRICK_ROWS-1,row));
            const bombObj={col:safeCol,row:safeRow,timer:hasDetonator ? Infinity : 2500,fuseInterval:null};
            if(!hasDetonator){
              bombObj.fuseInterval = setInterval(()=>{
              if(bombObj.timer <= 0) clearInterval(bombObj.fuseInterval);
              }, 180);
            }
            activeBombs.push(bombObj);
            bombsHeld--;
            bombDisplay.textContent=bombsHeld;
            if(bombsHeld===0) bombHud.style.display='none';
            spawnParticles(safeCol*BRICK_W+BRICK_W/2,safeRow*BRICK_H+BRICK_H/2,'#ff6600',10);
          } else if(hasDetonator && bombsHeld===0 && activeBombs.length>0 && gameRunning && ballLaunched){
            // Detonate all planted charges
            const toBlast=[...activeBombs];
            activeBombs=[];
            toBlast.forEach(bomb=>detonateBomb(bomb));
            showToast('💥 DETONATED!', '#ff6600');
          }
        }
        bothSidesHeld=false;
      }, 40);
    }
  }
}

const touchStartPos = {}; // track start position per touch id

gameArea.addEventListener('touchstart', e=>{
  if(builderOpen) return;
  e.preventDefault();
  for(const t of e.changedTouches){
    activeTouches[t.identifier] = getSide(t.clientX);
    touchStartPos[t.identifier] = { x: t.clientX, y: t.clientY };
  }
  updateMoveFlags();
  if(gameRunning&&!paused&&!ballLaunched) launchBall();
}, {passive:false});

gameArea.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(activeTouches[t.identifier]!==undefined){
      activeTouches[t.identifier] = getSide(t.clientX);
    }
  }
  updateMoveFlags();
}, {passive:false});

gameArea.addEventListener('touchend', e=>{
  e.preventDefault();
  if(isActive('skin_dynamite') && activeBombs.length > 0 && gameRunning && ballLaunched){
    const swipedDown = [];
    for(const t of e.changedTouches){
      const start = touchStartPos[t.identifier];
      if(start){
        const dy = t.clientY - start.y;
        const dx = Math.abs(t.clientX - start.x);
        if(dy >= 45 && dx < 60) swipedDown.push(getSide(start.x));
      }
    }
    if(swipedDown.length >= 2 || (swipedDown.includes('left') && swipedDown.includes('right'))){
      // Both sides swiped down - detonate ALL
      const toBlast = [...activeBombs];
      activeBombs = [];
      toBlast.forEach(bomb => detonateBomb(bomb));
      showToast('💥 ALL DETONATED!', '#ff6600');
    } else if(swipedDown.length === 1 && activeBombs.length > 0){
      // Single side swipe - detonate oldest (FIFO)
      const bomb = activeBombs.shift();
      detonateBomb(bomb);
      if(activeBombs.length > 0) showToast(`💥 ${activeBombs.length} charge${activeBombs.length!==1?'s':''} remaining`, '#ff6600');
    }
  }
  for(const t of e.changedTouches){
    delete activeTouches[t.identifier];
    delete touchStartPos[t.identifier];
  }
  updateMoveFlags();
}, {passive:false});

gameArea.addEventListener('touchcancel', e=>{
  for(const t of e.changedTouches){
    delete activeTouches[t.identifier];
    delete touchStartPos[t.identifier];
  }
  updateMoveFlags();
}, {passive:false});

// Mouse for desktop - left click = left, right click = right
gameArea.addEventListener('mousedown', e=>{
  if(builderOpen) return;
  activeTouches['mouse'] = getSide(e.clientX);
  updateMoveFlags();
  if(gameRunning&&!paused&&!ballLaunched) launchBall();
});
document.addEventListener('mouseup',   ()=>{ delete activeTouches['mouse']; updateMoveFlags(); });
document.addEventListener('mousemove', e=>{ if(activeTouches['mouse']){ activeTouches['mouse']=getSide(e.clientX); updateMoveFlags(); } });

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')  moveLeft=true;
  if(e.key==='ArrowRight') moveRight=true;
  if(e.key==='Escape' && gameRunning){ gameRunning=false; gameOver=false; ballLaunched=false; activeSeries=null; activeSeriesIdx=0; showTopBarBtns(false); showModeSelect(); }
  if((e.key===' '||e.key==='Enter')&&!gameRunning&&!builderOpen) showModeSelect();
  if(gameRunning&&!paused&&!ballLaunched) launchBall();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')  moveLeft=false;

});

function openLevelSelect(autoOpen){
  document.getElementById('levelSelectOverlay').style.display='flex';
  renderLevelList(autoOpen); // render with local data first

  // Throttle all cloud fetches to once per 10 seconds
  const now = Date.now();
  const shouldFetch = !window._lastLevelSelectSync || (now - window._lastLevelSelectSync > 10000);
  if (!shouldFetch) return;
  window._lastLevelSelectSync = now;

  Promise.all([
    fetchPublicSeries(),
    fetchPublicMaps(),
    syncChallenges()
  ]).then(([cloudPublic, cloudMaps, _]) => {
    let changed = false;

    // Merge public series
    const existingSeries = savedSeries();
    cloudPublic.forEach(cs => {
      if (!cs.levels) return;
      let levels;
      try { levels = typeof cs.levels === 'string' ? JSON.parse(cs.levels) : cs.levels; } catch(e) { return; }
      const found = existingSeries.find(s => s.name === cs.name);
      if (!found) {
        existingSeries.push({ ...cs, levels, is_public: true, received: true });
        changed = true;
      } else if (!found.is_public) {
        found.is_public = true;
        changed = true;
      }
    });
    if (changed) LS.set('cc_series', JSON.stringify(existingSeries));

    // Merge public standalone maps
    const existingLevels = savedLevels();
    cloudMaps.forEach(cm => {
      if (!cm.name) return;
      const isOwn = cm.creator_id === CREATOR_ID;
      const found = existingLevels.find(l => l.slug === cm.slug || l.name === cm.name);
      if (!found) {
        existingLevels.push({ ...cm, is_public: true, received: !isOwn });
        changed = true;
      } else {
        if (!found.is_public) { found.is_public = true; changed = true; }
      }
    });
    if (changed) LS.set('cc_levels', JSON.stringify(existingLevels));

    renderLevelList(); // always re-render to pick up challenge sync
  }).catch(() => {});
}
function closeLevelSelect(){
  _levelSelectOpenState = {};
  window._lastLevelSelectSync = null; // reset so next open fetches fresh
  document.getElementById('levelSelectOverlay').style.display='none';
  if(gameRunning){ paused=false; showTopBarBtns(true); }
  else { showModeSelect(); }
}

function drawLevelThumbnail(canvas, levelData){
  const tw=canvas.width, th=canvas.height;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,tw,th);

  if(!levelData || !levelData.bricks || !levelData.bricks.length) return;

  // Find grid extents from col/row
  const srcW = levelData.bricks[0].w || BRICK_W;
  const srcH = levelData.bricks[0].h || BRICK_H;
  const cols = BRICK_COLS, rows = BRICK_ROWS;
  const cw = tw/cols, ch = th/rows;

  levelData.bricks.forEach(b=>{
    const col = b.col !== undefined ? b.col : Math.round(b.x/srcW);
    const row = b.row !== undefined ? b.row : Math.round(b.y/srcH);
    if(col<0||col>=cols||row<0||row>=rows) return;
    let color;
    if(b.isSteel)   color='#8a9bb0';
    else if(b.isDiamond) color='#00eeff';
    else if(b.isSkull)   color='#222';
    else if(b.isWhite)   color='#e8e8f0';
    else if(b.isLock)    color='#b8860b';
    else if(b.isKey)     color='#ffd700';
    else if(b.isReverse) color='#888899';
    else color=b.color||'#888';
    ctx.fillStyle=color;
    ctx.fillRect(col*cw+0.5, row*ch+0.5, cw-1, ch-1);
  });

  // Draw ball
  const ballCol = levelData.ballCol !== undefined ? levelData.ballCol : Math.round((levelData.ballX||0)/srcW);
  const ballRow = levelData.ballRow !== undefined ? levelData.ballRow : Math.round((levelData.ballY||0)/srcH);
  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.arc(ballCol*cw+cw/2, ballRow*ch+ch/2, Math.max(1.5,cw*0.4), 0, Math.PI*2);
  ctx.fill();
}

function buildSteelPerimeter() {
  const perimeter = [];
  const mk = (col, row) => ({
    col, row, x: col*BRICK_W, y: row*BRICK_H, w: BRICK_W, h: BRICK_H,
    color: '#8a9bb0', isPaint:false, isSteel:true, isKey:false, isLock:false,
    isDiamond:false, isWhite:false, isSkull:false, isReverse:false, isBomb:false,
    hit:0, cooldown:0
  });
  for (let c = 0; c < BRICK_COLS; c++) {
    perimeter.push(mk(c, 0));
    perimeter.push(mk(c, BRICK_ROWS-1));
  }
  for (let r = 1; r < BRICK_ROWS-1; r++) {
    perimeter.push(mk(0, r));
    perimeter.push(mk(BRICK_COLS-1, r));
  }
  return perimeter;
}

function gridFromBricks(brickArr){
  const grid={};
  brickArr.forEach(b=>{ grid[`${b.col},${b.row}`]=b; });
  return grid;
}

function drawBuilder(){
  if(!builderOpen) return;
  const bW=bCanvas.width/DPR, bH=bCanvas.height/DPR;
  // Use exact game brick size so bricks aren't stretched
  const cellW=BRICK_W, cellH=BRICK_H;

  // Draw game background
  const _bgSrc = BACKGROUNDS[builderBackground] || BG_IMAGE.src;
  if(!builderBgImage || builderBgImage.src !== _bgSrc){
    builderBgImage = new Image();
    builderBgImage.onload = ()=>{ drawBuilder(); };
    builderBgImage.src = _bgSrc;
  }
  if(builderBgImage.complete && builderBgImage.naturalWidth>0){
    const scaleX = bW / builderBgImage.naturalWidth;
    const scaleY = bH / builderBgImage.naturalHeight;
    const scale = Math.max(scaleX, scaleY);
    const drawW = builderBgImage.naturalWidth * scale;
    const drawH = builderBgImage.naturalHeight * scale;
    const drawX = (bW - drawW) / 2;
    const drawY = (bH - drawH) / 2;
    bCtx.drawImage(builderBgImage, drawX, drawY, drawW, drawH);
    bCtx.fillStyle='rgba(0,0,0,0.45)'; bCtx.fillRect(0,0,bW,bH);
  } else {
    bCtx.fillStyle='#0a0804'; bCtx.fillRect(0,0,bW,bH);
  }

  // Subtle grid lines over grid area only
  bCtx.strokeStyle='rgba(255,255,255,0.08)'; bCtx.lineWidth=0.5;
  for(let c=0;c<=BUILDER_COLS;c++){ bCtx.beginPath();bCtx.moveTo(c*cellW,0);bCtx.lineTo(c*cellW,BUILDER_ROWS*cellH);bCtx.stroke(); }
  for(let r=0;r<=BUILDER_ROWS;r++){ bCtx.beginPath();bCtx.moveTo(0,r*cellH);bCtx.lineTo(BUILDER_COLS*cellW,r*cellH);bCtx.stroke(); }

  // Bricks
  const grid=gridFromBricks(builderBricks);
  for(let r=0;r<BUILDER_ROWS;r++){
    for(let c=0;c<BUILDER_COLS;c++){
      const key=`${c},${r}`;
      if(!grid[key]) continue;
      const b=grid[key];
      const drawB={ x:c*cellW, y:r*cellH, w:cellW, h:cellH,
                    color:b.color, isPaint:b.isPaint, isSteel:b.isSteel,
                    isKey:b.isKey, isLock:b.isLock, isDiamond:b.isDiamond,
                    isWhite:b.isWhite, isSkull:b.isSkull, isReverse:b.isReverse, isBomb:b.isBomb, cooldown:0 };
      drawBrick(bCtx,drawB);
    }
  }

  // Ball - use the same drawBall function as gameplay
  const ballPx=builderBallPos.col*cellW+cellW/2, ballPy=builderBallPos.row*cellH+cellH/2;
  drawBall(bCtx, {x:ballPx, y:ballPy, color:'#ffffff', trail:[]});

  // Cursor highlight
  if(builderHover){
    bCtx.strokeStyle='rgba(245,200,66,0.7)'; bCtx.lineWidth=2;
    bCtx.strokeRect(builderHover.c*cellW+1,builderHover.r*cellH+1,cellW-2,cellH-2);
    bCtx.lineWidth=1;
  }
}

let paletteDrawerOpen = true;

function builderCellFromEvent(e){
  const rect=bCanvas.getBoundingClientRect();
  const x=(e.clientX-rect.left), y=(e.clientY-rect.top);
  const palW = document.getElementById('palette').offsetWidth || (BRICK_W*2+9);
  if(paletteDrawerOpen && x > rect.width - palW) return null;
  const c=Math.floor(x/BRICK_W), r=Math.floor(y/BRICK_H);
  if(c<0||c>=BUILDER_COLS||r<0||r>=BUILDER_ROWS) return null;
  return {c,r};
}

function isClearZone(c,r){
  return Math.abs(c-builderBallPos.col)<=1 && Math.abs(r-builderBallPos.row)<=1;
}

function builderApplyTool(cell){
  if(!cell) return;
  if(selectedTool.type==='ball'){
    builderBallPos={ col:cell.c, row:cell.r };
    drawBuilder(); return;
  }
  const idx=builderBricks.findIndex(b=>b.col===cell.c&&b.row===cell.r);
  if(selectedTool.type==='eraser'){
    if(idx>=0) builderBricks.splice(idx,1);
  } else {
    // Cap diamonds at 5 per map
    if (selectedTool.type === 'diamond') {
      const existingDiamonds = builderBricks.filter(b => b.isDiamond).length;
      const replacingDiamond = idx >= 0 && builderBricks[idx].isDiamond;
      if (existingDiamonds >= 5 && !replacingDiamond) {
        showBuilderToast('Max 5 diamonds per map');
        return;
      }
    }
    const entry={ col:cell.c, row:cell.r,
      color:selectedTool.color||COLORS[0],
      isPaint:selectedTool.type==='paint',
      isSteel:selectedTool.type==='steel',
      isKey:selectedTool.type==='key',
      isLock:selectedTool.type==='lock',
      isDiamond:selectedTool.type==='diamond',
      isWhite:selectedTool.type==='white',
      isSkull:selectedTool.type==='skull',
      isReverse:selectedTool.type==='reverse',
      isBomb:selectedTool.type==='bomb' };
    if(idx>=0) builderBricks[idx]=entry; else builderBricks.push(entry);
  }
  drawBuilder();
}

bCanvas.addEventListener('pointerdown',e=>{
  const cell=builderCellFromEvent(e);
  if(!cell) return;
  e.preventDefault();
  builderPainting=true; builderHover=cell; builderApplyTool(cell);
});
bCanvas.addEventListener('pointermove',e=>{ builderHover=builderCellFromEvent(e); if(builderPainting) builderApplyTool(builderHover); else drawBuilder(); });
bCanvas.addEventListener('pointerup',  ()=>{ builderPainting=false; });
bCanvas.addEventListener('pointerleave',()=>{ builderHover=null; builderPainting=false; drawBuilder(); });

let builderCurrentLevelName=null; // name of the level currently loaded in builder

function loadLevelIntoBuilder(lv){
  const srcW = lv.bricks.length ? (lv.bricks[0].w || BRICK_W) : BRICK_W;
  const srcH = lv.bricks.length ? (lv.bricks[0].h || BRICK_H) : BRICK_H;
  builderBricks=lv.bricks.map(b=>({
    col:Math.round(b.x/srcW), row:Math.round(b.y/srcH),
    color:b.color, isPaint:!!b.isPaint, isSteel:!!b.isSteel,
    isKey:!!b.isKey, isLock:!!b.isLock, isDiamond:!!b.isDiamond,
    isWhite:!!b.isWhite, isSkull:!!b.isSkull, isReverse:!!b.isReverse, isBomb:!!b.isBomb
  }));
  if(lv.portal){
    const pc={col:Math.round(lv.portal.x/srcW), row:Math.round(lv.portal.y/srcH)};
    if(!builderBricks.find(b=>b.col===pc.col&&b.row===pc.row)){
      builderBricks.push({col:pc.col,row:pc.row,color:'#00eeff',
        isPaint:false,isSteel:false,isKey:false,isLock:false,isDiamond:true});
    }
  }
  if(lv.ballCol !== undefined){
    builderBallPos={ col:lv.ballCol, row:lv.ballRow };
  } else if(lv.ballX!=null){
    const srcW = lv.bricks.length ? (lv.bricks[0].w || BRICK_W) : BRICK_W;
    const srcH = lv.bricks.length ? (lv.bricks[0].h || BRICK_H) : BRICK_H;
    builderBallPos={ col:Math.round(lv.ballX/srcW), row:Math.round(lv.ballY/srcH) };
  }
  builderPortalPos=null;
  builderCurrentLevelName=lv.name;

  drawBuilder();
}

  ov.appendChild(panel);

  copyToClipboard(shareMsg,

    ()=>{ linkInput.select(); copyStatus.textContent = 'Auto-copy failed — select and copy above'; copyStatus.style.color = '#f4a261'; }
  );

  panel.querySelector('#slTextBtn').addEventListener('click', ()=>{
    window.location.href = `sms:?body=${encodeURIComponent(shareMsg)}`;
  });
  panel.querySelector('#slDoneBtn').addEventListener('click', ()=>ov.remove());
  ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });
}

// Inline rename popup - appears near the tapped element
function showRenamePopup(anchorEl, currentName, onSave) {
  const existing = document.getElementById('renamePopup');
  if(existing) existing.remove();

  const pop = document.createElement('div');
  pop.id = 'renamePopup';
  pop.style.cssText=`position:fixed;z-index:600;background:#1a1206;border:1px solid rgba(200,160,60,0.7);border-radius:4px;padding:10px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.7);`;

  pop.innerHTML=`
    <input id="renameInput" value="${currentName.replace(/"/g,'&quot;')}" maxlength="40"
      style="background:#0a0804;border:1px solid rgba(200,160,60,0.5);color:#f5c842;font-family:'Lato',sans-serif;font-size:14px;font-weight:700;padding:7px 10px;border-radius:3px;outline:none;width:200px;">
    <button id="renameSave" style="background:#2ec4b6;border:none;color:#000;font-family:'Lato',sans-serif;font-weight:700;font-size:13px;padding:7px 14px;border-radius:3px;cursor:pointer;flex-shrink:0;">Save</button>
    <button id="renameCancel" style="background:none;border:none;color:rgba(180,140,60,0.5);font-family:'Lato',sans-serif;font-size:18px;cursor:pointer;line-height:1;padding:0 2px;flex-shrink:0;">×</button>`;

  document.body.appendChild(pop);

  // Position near the anchor element
  const rect = anchorEl.getBoundingClientRect();
  const popW = 320;
  let left = rect.left;
  let top = rect.bottom + 6;
  if(left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
  if(top + 60 > window.innerHeight - 8) top = rect.top - 66;
  pop.style.left = left + 'px';
  pop.style.top  = top + 'px';

  const input = pop.querySelector('#renameInput');
  input.focus();
  input.select();

  const doSave = () => {
    const val = input.value.trim();
    if(val && val !== currentName) onSave(val);
    pop.remove();
  };

  pop.querySelector('#renameSave').addEventListener('click', doSave);
  pop.querySelector('#renameCancel').addEventListener('click', ()=>pop.remove());
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') doSave(); if(e.key==='Escape') pop.remove(); });

  // Close if clicking outside (but not the anchor that opened it)
  setTimeout(()=>{
    const outside = e=>{ if(!pop.contains(e.target) && e.target!==anchorEl){ pop.remove(); document.removeEventListener('pointerdown', outside); } };
    document.addEventListener('pointerdown', outside);
  }, 200);
}

function openMapsPanel(defaultTab='maps') {
  const existing = document.getElementById('mapsPanelOv');
  if(existing) existing.remove();

  const ov = document.createElement('div');
  ov.id = 'mapsPanelOv';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:300;display:flex;align-items:center;justify-content:center;';

  // Shared button style helpers
  const btnBase = `font-family:'Lato',sans-serif;font-weight:700;font-size:13px;cursor:pointer;border-radius:3px;flex-shrink:0;padding:6px 12px;`;
  const btnTeal = btnBase + `background:#2ec4b6;border:none;color:#000;`;
  const btnPurple = btnBase + `background:#9b5de5;border:none;color:#fff;`;
  const btnGhost = btnBase + `background:none;border:1px solid #2ec4b6;color:#2ec4b6;`;
  const btnDanger = `font-family:'Lato',sans-serif;font-weight:700;font-size:20px;cursor:pointer;background:none;border:none;color:#e63946;line-height:1;padding:0 4px;flex-shrink:0;`;

  ov.innerHTML=`<div style="background:#0f0f1a;border:2px solid rgba(200,160,60,0.6);padding:0;font-family:'Lato',sans-serif;width:min(420px,95vw);max-height:88vh;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;">
    <!-- Tabs -->
    <div style="display:flex;border-bottom:1px solid rgba(200,160,60,0.25);">
      <button id="tabMaps" style="flex:1;padding:14px 6px;font-family:'Cinzel',serif;font-weight:600;font-size:13px;cursor:pointer;border:none;border-bottom:2px solid transparent;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:7px;">
        <span id="tabMapsIcon"></span>MAPS
      </button>
      <button id="tabSeries" style="flex:1;padding:14px 6px;font-family:'Cinzel',serif;font-weight:600;font-size:13px;cursor:pointer;border:none;border-bottom:2px solid transparent;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:7px;">
        <span id="tabSeriesIcon"></span>SERIES
      </button>

    </div>
    <!-- Content area -->
    <div id="mapsPanelBody" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;"></div>
    <!-- Footer -->
    <div style="padding:10px 14px;border-top:1px solid rgba(200,160,60,0.15);">
      <button id="mapsPanelClose" style="width:100%;background:none;border:none;color:rgba(220,220,220,0.7);font-family:'Cinzel',serif;font-size:13px;cursor:pointer;padding:6px;">CLOSE</button>
    </div>
  </div>`;

  // Inject SVG icons safely outside template literal
  ov.querySelector('#tabMapsIcon').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>';
  ov.querySelector('#tabSeriesIcon').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';

  document.body.appendChild(ov);
  ov.querySelector('#mapsPanelClose').addEventListener('click',()=>ov.remove());

  const tabMaps = ov.querySelector('#tabMaps');
  const tabSeries = ov.querySelector('#tabSeries');
  const body = ov.querySelector('#mapsPanelBody');

  const tabActiveStyle = 'background:#1a1206;color:#f5c842;border-bottom:2px solid #f5c842;';
  const tabIdleStyle   = 'background:#0f0f1a;color:#666;border-bottom:2px solid transparent;';

  function renderMapsTab(){
    tabMaps.style.cssText   = tabMaps.style.cssText.replace(/background[^;]+;|color[^;]+;|border-bottom[^;]+;/g,'') + tabActiveStyle;
    tabSeries.style.cssText = tabSeries.style.cssText.replace(/background[^;]+;|color[^;]+;|border-bottom[^;]+;/g,'') + tabIdleStyle;

    // Union of individually saved maps + maps embedded in series
    const saved = savedLevels();
    // Build a set of all map names that appear in any series
    const inSeriesNames = new Set();
    savedSeries().forEach(s=>{ s.levels.forEach(l=>{ inSeriesNames.add(l.name); }); });

    // Standalone = saved maps NOT in any series
    // Series maps = all maps that appear in a series (whether also saved or not)
    const standaloneOnly = saved.filter(l=>!inSeriesNames.has(l.name));
    const seenSeriesNames = new Set();
    const fromSeries = [];
    savedSeries().forEach(s=>{
      s.levels.forEach(l=>{
        if(!seenSeriesNames.has(l.name)){
          seenSeriesNames.add(l.name);
          // Get full data from savedLevels if available, else use series data
          const full = saved.find(x=>x.name===l.name) || l;
          fromSeries.push({...full, _fromSeries:true});
        }
      });
    });
    const allMaps = [...standaloneOnly, ...fromSeries];
    const savedNames = new Set(allMaps.map(l=>l.name)); // keep for compat
    body.innerHTML = '';
    body.style.padding = '8px';

    if(!allMaps.length){
      const empty = document.createElement('div');
      empty.style.cssText=`color:#555;font-size:14px;font-family:'Lato',sans-serif;padding:20px 0;text-align:center;line-height:1.8;`;
      empty.textContent='No cells yet. Build your first.';
      body.appendChild(empty);
      return;
    }

    // Separate standalone maps from series maps
    const standaloneMaps = allMaps.filter(l=>!l._fromSeries);
    const seriesMaps = allMaps.filter(l=>l._fromSeries);

    function renderGrid(maps, container){
      const grid = document.createElement('div');
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;';
      container.appendChild(grid);
      return grid;
    }

    const TH = 90;
    const challengeMapNames = new Set(getLocalChallenges().flatMap(c => [c.mapName].filter(Boolean)));

    function makeZoneHeader(text) {
      const el = document.createElement('div');
      el.style.cssText = 'width:100%;display:flex;align-items:center;gap:10px;margin:14px 0 10px;padding:0 2px;box-sizing:border-box;';
      el.innerHTML = '<div style="flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(200,160,60,0.5));"></div>'
        + `<span style="font-family:'Cinzel',serif;font-size:10px;font-weight:700;letter-spacing:3px;color:rgba(200,160,60,0.8);white-space:nowrap;">${text}</span>`
        + '<div style="flex:1;height:1px;background:linear-gradient(270deg,transparent,rgba(200,160,60,0.5));"></div>';
      return el;
    }

    function makeSeriesHeader(sName, isOpen) {
      const el = document.createElement('div');
      el.style.cssText = 'width:100%;display:flex;align-items:center;gap:8px;margin:10px 0 6px;padding:0 2px;box-sizing:border-box;cursor:pointer;';
      el.innerHTML = '<div style="flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(150,110,40,0.3));"></div>'
        + `<span style="font-family:'Cinzel',serif;font-size:9px;font-weight:600;letter-spacing:2px;color:rgba(180,140,60,0.6);white-space:nowrap;">${sName}</span>`
        + `<span style="color:rgba(180,140,60,0.4);font-size:9px;margin-left:2px;">${isOpen ? '▲' : '▼'}</span>`
        + '<div style="flex:1;height:1px;background:linear-gradient(270deg,transparent,rgba(150,110,40,0.3));"></div>';
      return el;
    }

    function makeCard(lv) {
      const owned = isOwnedMap(lv) || lv._fromSeries;
      const isAdmin = !!lv._adminImport;
      const isChallenge = challengeMapNames.has(lv.name) || !!lv._challenge;
      const cardBg = isChallenge ? '#1a0505' : isAdmin ? '#141418' : owned ? '#141418' : '#0d1f2d';
      const cardBorder = isChallenge ? 'rgba(220,60,60,0.45)' : isAdmin ? 'rgba(200,200,210,0.35)' : owned ? 'rgba(200,200,210,0.25)' : 'rgba(46,196,182,0.3)';
      const card = document.createElement('div');
      card.style.cssText = `display:flex;flex-direction:column;align-items:stretch;min-width:0;background:${cardBg};border:1px solid ${cardBorder};border-radius:4px;overflow:hidden;position:relative;box-shadow:0 2px 8px rgba(0,0,0,0.4);`;
      return { card, owned, isAdmin, isChallenge };
    }

    function makeGrid(parent) {
      const g = document.createElement('div');
      g.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;';
      parent.appendChild(g);
      return g;
    }

    // ── STANDALONE ──────────────────────────────────────────────
    let grid = null;
    if (standaloneMaps.length) {
      body.appendChild(makeZoneHeader('STANDALONE'));
      grid = makeGrid(body);
    }

    // ── IN A SERIES ─────────────────────────────────────────────
    // Group series maps by series name, preserve series order
    const seriesGroups = {}; // seriesName -> {maps:[], isOpen:bool, isChallenge:bool}
    const seriesOrder = [];
    savedSeries().forEach(s => {
      if (!seriesGroups[s.name]) { seriesGroups[s.name] = { maps: [], isOpen: false, isChallenge: !!s._isChallengeSeries }; seriesOrder.push(s.name); }
      s.levels.forEach(l => {
        const full = saved.find(x => x.name === l.name) || l;
        if (!seriesGroups[s.name].maps.find(m => m.name === full.name)) {
          seriesGroups[s.name].maps.push({ ...full, _fromSeries: true });
        }
      });
    });

    // Track which series sections are open (persist across re-renders)
    if (!window._builderSeriesOpen) window._builderSeriesOpen = {};

    let seriesGrid = null; // will be set per-series section

    if (seriesMaps.length) {
      if (standaloneMaps.length) body.appendChild(makeZoneHeader('IN A SERIES'));
      seriesOrder.forEach(sName => {
        const group = seriesGroups[sName];
        if (!group || !group.maps.length) return;
        const isOpen = !!window._builderSeriesOpen[sName];
        const isChallenge = !!group.isChallenge;

        // Series header - collapsible
        const hdr = document.createElement('div');
        const borderColor = isChallenge ? 'rgba(220,60,60,0.45)' : 'rgba(140,100,30,0.25)';
        const bgColor = isChallenge ? 'rgba(30,5,5,0.95)' : 'rgba(18,13,4,0.95)';
        const nameColor = isChallenge ? '#e63946' : '#c9a84c';
        hdr.style.cssText = `display:flex;align-items:center;justify-content:space-between;padding:7px 10px;cursor:pointer;border-radius:3px;background:${bgColor};border:1px solid ${borderColor};margin-bottom:${isOpen?'0':'6px'};border-bottom-left-radius:${isOpen?'0':'3px'};border-bottom-right-radius:${isOpen?'0':'3px'};`;
        hdr.innerHTML = `<span style="font-family:'Cinzel',serif;font-size:11px;font-weight:700;color:${nameColor};">${sName}</span>`
          + `<span style="color:${isChallenge ? 'rgba(220,60,60,0.5)' : 'rgba(200,160,60,0.5)'};font-size:10px;">${isOpen ? '▲' : '▼'}</span>`;
        hdr.addEventListener('click', () => {
          window._builderSeriesOpen[sName] = !window._builderSeriesOpen[sName];
          openMapsPanel('maps');
        });
        body.appendChild(hdr);

        if (isOpen) {
          const panel = document.createElement('div');
          panel.dataset.seriesPanel = sName;
          panel.style.cssText = `display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;border:1px solid ${borderColor};border-top:none;border-bottom-left-radius:3px;border-bottom-right-radius:3px;padding:8px;box-sizing:border-box;background:rgba(10,8,4,0.97);margin-bottom:6px;`;
          body.appendChild(panel);
          seriesGrid = panel;
        }
      });
    }

    // Build set for quick series membership lookup
    const mapToSeriesGrid = {};
    if (seriesMaps.length) {
      seriesOrder.forEach(sName => {
        if (!window._builderSeriesOpen[sName]) return;
        const group = seriesGroups[sName];
        if (group) group.maps.forEach(m => { mapToSeriesGrid[m.name] = sName; });
      });
    }

    allMaps.forEach((lv, i) => {
      // Find the right grid for this map
      if (lv._fromSeries) {
        const sName = Object.keys(seriesGroups).find(k => seriesGroups[k].maps.find(m => m.name === lv.name));
        if (!sName || !window._builderSeriesOpen[sName]) return; // collapsed, skip
        // Find the panel for this series
        const allPanels = body.querySelectorAll('div[style*="grid-template-columns"]');
        // We'll append to the right panel below
      }
      const owned = isOwnedMap(lv) || lv._fromSeries;
      const isAdmin = !!lv._adminImport;
      const isChallenge = challengeMapNames.has(lv.name) || !!lv._challenge;

      const card = document.createElement('div');
      const cardBg = isChallenge ? '#1a0505' : isAdmin ? '#141418' : owned ? '#141418' : '#0d1f2d';
      const cardBorder = isChallenge ? 'rgba(220,60,60,0.45)' : isAdmin ? 'rgba(200,200,210,0.35)' : owned ? 'rgba(200,200,210,0.25)' : 'rgba(46,196,182,0.3)';
      card.style.cssText = `display:flex;flex-direction:column;align-items:stretch;min-width:0;background:${cardBg};border:1px solid ${cardBorder};border-radius:4px;overflow:hidden;position:relative;box-shadow:0 2px 8px rgba(0,0,0,0.4);`;

      // Thumbnail canvas - fills card width
      const cnv = document.createElement('canvas');
      cnv.width = 120; cnv.height = TH;
      cnv.style.cssText = `display:block;width:100%;height:${TH}px;cursor:pointer;`;
      const tc = cnv.getContext('2d');
      tc.fillStyle = '#0a0a14';
      tc.fillRect(0,0,120,TH);

          const row = b.row !== undefined ? b.row : Math.round(b.y/(b.h||BRICK_H));
          if(col<0||col>=BRICK_COLS||row<0||row>=BRICK_ROWS) return;
          let color = b.color||'#888';
          if(b.isSteel)        color='#8a9bb0';
          else if(b.isDiamond) color='#00eeff';
          else if(b.isKey)     color='#ffd700';
          else if(b.isLock)    color='#b8860b';
          else if(b.isSkull)   color='#333';
          else if(b.isBomb)    color='#ff6600';
          else if(b.isReverse) color='#9966cc';
          else if(b.isWhite)   color='#e8e8f0';

        addRow.style.cssText = 'display:flex;gap:6px;align-items:center;';
